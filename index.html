<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A.</title>
    <!-- Biblioteca Marked.js para renderizar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: #000000;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            background: #000000;
            z-index: 10;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            max-width: 85%;
            padding: 14px 20px;
            font-size: clamp(14px, 2vw, 16px);
            line-height: 1.5;
            word-wrap: break-word;
            border-radius: 20px;
            animation: fadeIn 0.3s ease forwards;
            position: relative;
        }

        .ai-message {
            background-color: #1f2937;
            color: #f9fafb;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Estilização para Markdown e Botão de Ouvir */
        .ai-message p { margin-bottom: 8px; }
        .ai-message p:last-child { margin-bottom: 0; }
        .ai-message strong { color: #ffffff; font-weight: 600; }
        .ai-message ul, .ai-message ol { margin-left: 20px; margin-bottom: 8px; }
        .ai-message code { background: #111827; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .ai-message pre { background: #111827; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 8px; }
        .ai-message pre code { background: transparent; padding: 0; }

        .tts-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: color 0.2s;
        }

        .tts-btn:hover {
            color: #ffffff;
        }

        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 20px;
            background-color: #1f2937;
            align-self: flex-start;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            animation: fadeIn 0.3s ease forwards;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }

        .input-wrapper {
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(transparent, #000000 40%);
            position: relative;
        }

        /* Gestão de Múltiplos Anexos (Fila) */
        .preview-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 10px;
            display: none;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .preview-container.active {
            display: flex;
            animation: fadeIn 0.2s ease forwards;
        }

        .preview-card {
            background: #111827;
            border: 1px solid #374151;
            padding: 6px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            max-width: 200px;
        }

        .preview-thumb {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #9ca3af;
            font-weight: bold;
        }

        .preview-info {
            font-size: 12px;
            color: #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .remove-preview {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 2px;
            border-radius: 50%;
            display: flex;
            align-items: center;
        }

        .remove-preview:hover {
            color: #ef4444;
        }

        /* Menu Popup de Anexos */
        .attachment-menu {
            position: absolute;
            bottom: 85px;
            left: calc(50% - 350px);
            background: #111827;
            border: 1px solid #374151;
            border-radius: 16px;
            width: 200px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 100;
        }

        @media (max-width: 840px) {
            .attachment-menu {
                left: 20px;
            }
        }

        .attachment-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: #e2e8f0;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: #1f2937;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            stroke: #9ca3af;
        }

        .input-area {
            display: flex;
            width: 100%;
            max-width: 800px;
            gap: 8px;
            background: #111827;
            padding: 8px;
            border-radius: 40px;
            border: 1px solid #374151;
            align-items: center;
        }

        .plus-btn, .mic-btn {
            background: transparent;
            color: #9ca3af;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .plus-btn:hover, .mic-btn:hover {
            background: #1f2937;
            color: #ffffff;
        }

        /* Área de Gravação com Ondas, Temporizador e Botão Cancelar */
        .recording-box {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            height: 38px;
        }

        .recording-box.active {
            display: flex;
        }

        .recording-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rec-timer {
            font-size: 13px;
            color: #ef4444;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .sound-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 18px;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background-color: #ef4444;
            border-radius: 3px;
            animation: waveAnim 1s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { animation-delay: 0.15s; }

        @keyframes waveAnim {
            0%, 100% { transform: scaleY(0.2); opacity: 0.4; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        .cancel-rec-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cancel-rec-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            padding-left: 5px;
            width: 100%;
        }

        .input-area input::placeholder {
            color: #9ca3af;
        }

        .input-area button.send-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .input-area button.send-btn:hover {
            background: #e5e7eb;
            transform: scale(1.05);
        }

        /* Efeito visual ao arrastar ficheiros para a janela */
        body.dragover::after {
            content: "Largue os ficheiros aqui para anexar";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(37, 99, 235, 0.85);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 999;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">Chronical I.A.</div>
    <div class="chat-container" id="chatMessages">
        <div class="message ai-message">
            Olá! Como posso ajudar você hoje?
            <button class="tts-btn" onclick="speakText('Olá! Como posso ajudar você hoje?')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                Ouvir resposta
            </button>
        </div>
    </div>

    <div class="input-wrapper">
        <!-- Fila de Pré-visualização de Múltiplos Anexos -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="attachment-menu" id="attachmentMenu">
            <button class="menu-item" id="btnPhoto">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Enviar Foto
            </button>
            <button class="menu-item" id="btnFile">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Enviar Ficheiro
            </button>
        </div>

        <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
        <input type="file" id="fileInput" multiple style="display: none;">

        <div class="input-area">
            <button class="plus-btn" id="plusButton" aria-label="Adicionar anexo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Campo de Texto normal -->
            <input type="text" id="userInput" placeholder="Pergunte à Chronical..." autocomplete="off" autofocus>
            
            <!-- Caixa de Gravação de Voz (Ondas, Temporizador e Cancelar) -->
            <div class="recording-box" id="recordingBox">
                <div class="recording-left">
                    <div class="sound-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                    <span class="rec-timer" id="recTimer">0:00</span>
                </div>
                <button class="cancel-rec-btn" id="cancelRecBtn" title="Cancelar gravação">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <button class="mic-btn" id="micButton" aria-label="Falar por voz">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>

            <button class="send-btn" id="sendButton" aria-label="Enviar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const plusButton = document.getElementById('plusButton');
        const attachmentMenu = document.getElementById('attachmentMenu');
        const btnPhoto = document.getElementById('btnPhoto');
        const btnFile = document.getElementById('btnFile');
        const micButton = document.getElementById('micButton');
        const recordingBox = document.getElementById('recordingBox');
        const recTimer = document.getElementById('recTimer');
        const cancelRecBtn = document.getElementById('cancelRecBtn');
        
        const imageInput = document.getElementById('imageInput');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');

        let attachedFiles = [];
        let recognition = null;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isCancelled = false;

        // Gestão do menu de anexos
        plusButton.addEventListener('click', (e) => {
            e.stopPropagation();
            attachmentMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            attachmentMenu.classList.remove('active');
        });

        attachmentMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        btnPhoto.addEventListener('click', () => {
            attachmentMenu.classList.remove('active');
            imageInput.click();
        });

        btnFile.addEventListener('click', () => {
            attachmentMenu.classList.remove('active');
            fileInput.click();
        });

        // Adicionar múltiplos ficheiros à fila
        function handleFiles(files) {
            for (let file of files) {
                attachedFiles.push(file);
            }
            renderPreviews();
        }

        imageInput.addEventListener('change', (e) => handleFiles(e.target.files));
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function renderPreviews() {
            previewContainer.innerHTML = '';
            if (attachedFiles.length === 0) {
                previewContainer.classList.remove('active');
                return;
            }

            previewContainer.classList.add('active');
            attachedFiles.forEach((file, index) => {
                const card = document.createElement('div');
                card.className = 'preview-card';

                const thumb = document.createElement('div');
                thumb.className = 'preview-thumb';

                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        thumb.style.backgroundImage = `url(${e.target.result})`;
                        thumb.style.backgroundSize = 'cover';
                        thumb.textContent = '';
                    };
                    reader.readAsDataURL(file);
                } else {
                    thumb.textContent = file.name.split('.').pop().toUpperCase().slice(0, 4);
                }

                const info = document.createElement('div');
                info.className = 'preview-info';
                info.textContent = file.name;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-preview';
                removeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                removeBtn.onclick = () => {
                    attachedFiles.splice(index, 1);
                    renderPreviews();
                };

                card.appendChild(thumb);
                card.appendChild(info);
                card.appendChild(removeBtn);
                previewContainer.appendChild(card);
            });
        }

        // Drag and Drop global
        window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragover'); });
        window.addEventListener('dragleave', (e) => { e.preventDefault(); document.body.classList.remove('dragover'); });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            document.body.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // Reconhecimento de Voz Avançado (com temporizador e cancelar)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isCancelled = false;
                micButton.classList.add('recording');
                userInput.style.display = 'none';
                recordingBox.classList.add('active');
                
                secondsElapsed = 0;
                recTimer.textContent = "0:00";
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60);
                    let secs = secondsElapsed % 60;
                    recTimer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            };

            recognition.onresult = (event) => {
                if (!isCancelled) {
                    userInput.value = event.results[0][0].transcript;
                }
            };

            recognition.onerror = () => {
                stopRecordingUI();
            };

            recognition.onend = () => {
                clearInterval(timerInterval);
                stopRecordingUI();
                
                if (!isCancelled && userInput.value.trim() !== '') {
                    sendMessage();
                }
            };
        }

        function stopRecordingUI() {
            clearInterval(timerInterval);
            micButton.classList.remove('recording');
            recordingBox.classList.remove('active');
            userInput.style.display = 'block';
        }

        cancelRecBtn.addEventListener('click', () => {
            isCancelled = true;
            userInput.value = '';
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            stopRecordingUI();
        });

        micButton.addEventListener('click', () => {
            if (!recognition) {
                alert('O seu navegador não suporta reconhecimento de voz.');
                return;
            }
            if (micButton.classList.contains('recording')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // Síntese de Voz (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('O seu navegador não suporta síntese de voz.');
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && attachedFiles.length === 0) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            
            let displayContent = text;
            if (attachedFiles.length > 0) {
                const names = attachedFiles.map(f => f.name).join(', ');
                displayContent = text ? `${text} [Anexos: ${names}]` : `[Anexos: ${names}]`;
            }
            userMsg.textContent = displayContent;
            chatMessages.appendChild(userMsg);
            
            userInput.value = '';
            attachedFiles = [];
            imageInput.value = '';
            fileInput.value = '';
            previewContainer.classList.remove('active');

            chatMessages.scrollTop = chatMessages.scrollHeight;

            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatMessages.appendChild(typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                chatMessages.removeChild(typingIndicator);

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                
                const rawResponse = data.response || data.reply || "Resposta recebida.";
                aiMsg.innerHTML = marked.parse(rawResponse);

                // Adicionar botão de leitura de voz na mensagem da I.A.
                const ttsBtn = document.createElement('button');
                ttsBtn.className = 'tts-btn';
                ttsBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Ouvir resposta';
                ttsBtn.onclick = () => speakText(rawResponse.replace(/<[^>]*>?/gm, '')); // Remove tags HTML para ler limpo
                
                aiMsg.appendChild(ttsBtn);
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                if (chatMessages.contains(typingIndicator)) {
                    chatMessages.removeChild(typingIndicator);
                }

                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = "Erro ao comunicar com o servidor.";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            userInput.focus();
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
