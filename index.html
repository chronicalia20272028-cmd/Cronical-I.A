<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <style>
        /* --- VARIÁVEIS GLOBAIS DE ESCALA --- */
        :root {
            --font-size: 14px;
            --header-height: 56px;
            --chat-max-width: 800px;
            --padding-base: 16px;
            --border-radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            font-size: var(--font-size);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Cabeçalho */
        header {
            height: var(--header-height);
            min-height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 var(--padding-base);
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            flex-shrink: 0;
            z-index: 10;
        }

        .menu-toggle-btn {
            position: absolute;
            left: var(--padding-base);
            background: transparent;
            border: none;
            color: #f1f5f9;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* --- MENU LATERAL (SIDEBAR AVANÇADO) --- */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
            z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: 0; 
            width: clamp(280px, 80vw, 340px); 
            height: 100%;
            background: #0a0d14; border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 999; display: flex; flex-direction: column; padding: var(--padding-base); gap: 12px;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.05rem; font-weight: 700; padding-bottom: 4px;
        }
        .close-sidebar-btn { background: transparent; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer; }

        .new-chat-btn {
            background: #2563eb; color: #ffffff; border: none; padding: 12px 14px;
            border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,0.25);
        }
        .new-chat-btn:hover { background: #1d4ed8; }

        /* Caixa de Pesquisa no Menu */
        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: #2563eb; }
        .search-box::placeholder { color: #64748b; }

        /* Lista de Histórico */
        .history-section-title {
            font-size: 0.75rem; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; margin-top: 4px;
        }

        .history-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; color: #cbd5e1;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            transition: all 0.2s; text-align: left; width: 100%;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .history-item.active { background: rgba(37, 99, 235, 0.18); border-color: rgba(37, 99, 235, 0.4); color: #93c5fd; font-weight: 500; }

        .history-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }

        .delete-chat-btn {
            background: transparent; border: none; color: #64748b; cursor: pointer; padding: 2px 6px; font-size: 0.9rem; border-radius: 4px; opacity: 0; transition: opacity 0.2s;
        }
        .history-item:hover .delete-chat-btn { opacity: 1; }
        .delete-chat-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        /* Rodapé do Menu */
        .sidebar-footer {
            border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .clear-history-btn {
            background: transparent; border: none; color: #94a3b8; font-size: 0.85rem; cursor: pointer; padding: 8px; border-radius: 8px; width: 100%; text-align: center; transition: background 0.2s;
        }
        .clear-history-btn:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        
        .app-version {
            font-size: 0.75rem; color: #475569; text-align: center;
        }


        /* Área de Chat */
        .chat-main {
            flex: 1;
            width: 100%;
            max-width: var(--chat-max-width);
            margin: 0 auto;
            padding: var(--padding-base);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: var(--border-radius);
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .message.ai {
            background-color: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        /* Zona de Input */
        .input-section {
            width: 100%;
            max-width: var(--chat-max-width);
            margin: 0 auto;
            padding: var(--padding-base);
            background: #000000;
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            padding: 6px 4px;
            resize: none;
            max-height: 120px;
            min-height: 22px;
            line-height: 1.4;
        }

        textarea::placeholder { color: #64748b; }

        .send-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .send-submit:hover { background: #cbd5e1; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }


        /* ==========================================================
           ADAPTAÇÕES POR DISPOSITIVO (MEDIA QUERIES)
           ========================================================== */
        @media (max-width: 320px) {
            :root {
                --font-size: 11px;
                --header-height: 40px;
                --padding-base: 6px;
                --border-radius: 10px;
            }
            .message { max-width: 95%; padding: 6px 10px; }
            .send-submit { width: 28px; height: 28px; min-width: 28px; }
            .send-submit svg { width: 12px; height: 12px; }
        }

        @media (min-width: 768px) {
            :root {
                --font-size: 15px;
                --header-height: 64px;
                --chat-max-width: 850px;
                --padding-base: 24px;
                --border-radius: 16px;
            }
            .send-submit { width: 42px; height: 42px; min-width: 42px; }
            .send-submit svg { width: 18px; height: 18px; }
        }

        @media (min-width: 1400px) {
            :root {
                --font-size: 18px;
                --header-height: 76px;
                --chat-max-width: 1100px;
                --padding-base: 32px;
                --border-radius: 20px;
            }
            .send-submit { width: 50px; height: 50px; min-width: 50px; }
            .send-submit svg { width: 22px; height: 22px; }
            .input-box { border-radius: 32px; padding: 12px 18px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Menu Lateral & Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Menu Principal</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
            </div>
            
            <button class="new-chat-btn" id="newChatBtn">
                <span>+</span> Nova Conversa
            </button>

            <!-- Barra de Pesquisa -->
            <input type="text" class="search-box" id="searchBox" placeholder="Pesquisar conversas...">

            <div class="history-section-title">Conversas Anteriores</div>
            <div class="history-list" id="historyList">
                <!-- Preenchido dinamicamente via JS -->
            </div>

            <div class="sidebar-footer">
                <button class="clear-history-btn" id="clearHistoryBtn">Limpar Histórico</button>
                <div class="app-version">Chronical I.A • v2.0</div>
            </div>
        </aside>

        <!-- Cabeçalho -->
        <header>
            <button class="menu-toggle-btn" id="menuToggleBtn" title="Abrir Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="app-title">Chronical I.A</div>
        </header>

        <!-- Mensagens do Chat -->
        <main class="chat-main" id="chatMain">
            <div class="message ai">Olá! Como posso ajudar você hoje?</div>
        </main>

        <!-- Barra de Input -->
        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const searchBox = document.getElementById('searchBox');

        let chats = JSON.parse(localStorage.getItem('chronical_chats')) || [];
        let currentChatId = localStorage.getItem('chronical_active_id') || null;

        // Controlo do Menu Lateral
        menuToggleBtn.onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); renderHistory(); };
        closeSidebarBtn.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };

        // Renderizar a lista de conversas (com suporte a filtro de pesquisa)
        function renderHistory(filterText = '') {
            historyList.innerHTML = '';
            const filteredChats = chats.filter(chat => chat.title.toLowerCase().includes(filterText.toLowerCase()));

            if (filteredChats.length === 0) {
                historyList.innerHTML = '<div style="font-size: 0.85rem; color: #64748b; padding: 8px 0;">Nenhuma conversa encontrada.</div>';
                return;
            }

            filteredChats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                
                const textSpan = document.createElement('span');
                textSpan.className = 'history-text';
                textSpan.textContent = chat.title;
                textSpan.onclick = () => loadChat(chat.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-chat-btn';
                deleteBtn.textContent = '✕';
                deleteBtn.title = 'Apagar conversa';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                };

                item.appendChild(textSpan);
                item.appendChild(deleteBtn);
                historyList.appendChild(item);
            });
        }

        // Evento de pesquisa em tempo real
        searchBox.oninput = (e) => {
            renderHistory(e.target.value);
        };

        // Criar Nova Conversa
        newChatBtn.onclick = () => {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('chronical_active_id', currentChatId);
            chatMain.innerHTML = '<div class="message ai">Nova conversa iniciada! Como posso ajudar?</div>';
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            searchBox.value = '';
        };

        // Carregar Conversa Específica
        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = chat.id;
            localStorage.setItem('chronical_active_id', currentChatId);

            chatMain.innerHTML = '';
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}`;
                div.textContent = msg.text;
                chatMain.appendChild(div);
            });
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        // Apagar Conversa Individual
        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
            if (currentChatId === id) {
                newChatBtn.click();
            } else {
                renderHistory(searchBox.value);
            }
        }

        // Limpar Todo o Histórico
        clearHistoryBtn.onclick = () => {
            if (confirm("Tens a certeza que queres limpar todo o histórico?")) {
                chats = [];
                localStorage.removeItem('chronical_chats');
                newChatBtn.click();
            }
        };

        // Guardar Mensagens no Histórico
        function saveMessageToCurrentChat(userText, aiText) {
            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                localStorage.setItem('chronical_active_id', currentChatId);
            }

            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { id: currentChatId, title: userText.substring(0, 28) + '...', messages: [] };
                chats.unshift(chat);
            }
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'ai', text: aiText });
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
        }

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = () => {
            const text = userInput.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            chatMain.appendChild(userDiv);

            userInput.value = '';
            userInput.style.height = 'auto';
            chatMain.scrollTop = chatMain.scrollHeight;

            const aiReply = "Mensagem recebida: " + text;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.textContent = aiReply;
                chatMain.appendChild(aiDiv);
                chatMain.scrollTop = chatMain.scrollHeight;

                saveMessageToCurrentChat(text, aiReply);
            }, 500);
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
