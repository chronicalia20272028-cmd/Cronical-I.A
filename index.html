<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A.</title>
    <style>
        :root {
            --bg: #0b0f19; /* Fundo noturno profundo */
            --text: #e2e8f0;
            --accent: #3b82f6;
            --ai-bubble: #1e293b; /* Cinza azulado para a IA */
            --user-bubble: #2563eb; /* Azul vibrante para o utilizador */
        }
        
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            background-color: var(--bg); 
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        /* Cabeçalho moderno com efeito de vidro (blur) */
        .header {
            text-align: center; 
            padding: 20px; 
            font-size: 20px; 
            font-weight: 600;
            background: rgba(11, 15, 25, 0.8); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            z-index: 10;
        }

        /* Área centralizada de mensagens */
        .chat-container {
            flex: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            max-width: 800px; 
            margin: 0 auto; 
            width: 100%; 
            scroll-behavior: smooth;
        }

        /* Balões muito arredondados (sem cantos quadrados) */
        .message {
            max-width: 85%; 
            padding: 14px 20px; 
            font-size: clamp(14px, 2vw, 16px);
            line-height: 1.5; 
            word-wrap: break-word; 
            border-radius: 24px;
        }

        .ai-message {
            background-color: var(--ai-bubble); 
            align-self: flex-start;
            border-bottom-left-radius: 6px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .user-message {
            background-color: var(--user-bubble); 
            color: white; 
            align-self: flex-end;
            border-bottom-right-radius: 6px; 
            box-shadow: 0 4px 6px rgba(37,99,235,0.2);
        }

        /* Área de escrita flutuante (estilo pílula) */
        .input-wrapper {
            padding: 15px 20px 25px; 
            background: linear-gradient(transparent, var(--bg) 30%);
        }

        .input-area {
            display: flex; 
            gap: 10px; 
            max-width: 800px; 
            margin: 0 auto;
            background: #1e293b; 
            padding: 8px; 
            border-radius: 40px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-area input {
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white;
            padding: 10px 20px; 
            font-size: 16px; 
            outline: none;
        }

        .input-area button {
            background: var(--accent); 
            color: white; 
            border: none;
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: 600;
            cursor: pointer; 
            transition: 0.2s;
        }

        .input-area button:hover { 
            background: #2563eb; 
        }

        /* Scrollbar elegante e minimalista */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">Chronical I.A.</div>
    <div class="chat-container" id="chatMessages">
        <div class="message ai-message">Olá! Como posso ajudar você hoje?</div>
    </div>
    <div class="input-wrapper">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escreva a sua mensagem..." autocomplete="off">
            <button id="sendButton">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = data.response || data.reply || "Resposta recebida.";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = "Erro ao comunicar com o servidor.";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
