<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A - Assistente Virtual Inteligente</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://api.iconify.design/lucide:bot.svg?color=%232563eb">

    <!-- Meta tag de verificação do Google Search Console -->
    <meta name="google-site-verification" content="RTk2iyL1IPrMR9r0lSAnelie5gPdjB-ddA5DJ5s2mg4" />

    <!-- SEO & Indexação Google -->
    <meta name="description" content="Chronical I.A - Assistente virtual de inteligência artificial para responder dúvidas, programar e organizar ideias.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://cronical-i-a.onrender.com/">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Markdown e Highlight.js para código formatado -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --font-size: 14px;
            --header-height: 56px;
            --chat-max-width: 800px;
            --padding-base: 16px;
            --border-radius: 14px;

            --bg-color: #000000;
            --text-color: #f1f5f9;
            --sidebar-bg: #040609;
            --sidebar-hover: rgba(255, 255, 255, 0.05);
            --card-bg: #0b0f19;
            --border-color: rgba(255, 255, 255, 0.06);
            --muted-color: #64748b;
            --input-bg: #0b0f19;
            --user-msg-bg: #2563eb;
            --modal-bg: #080b11;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sidebar-bg: #ffffff;
            --sidebar-hover: rgba(0, 0, 0, 0.04);
            --card-bg: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.08);
            --muted-color: #64748b;
            --input-bg: #ffffff;
            --user-msg-bg: #2563eb;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100vh; height: 100dvh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; font-size: var(--font-size);
            transition: background-color 0.2s, color 0.2s;
        }

        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }

        header {
            height: var(--header-height); min-height: var(--header-height);
            display: flex; align-items: center; justify-content: center;
            padding: 0 var(--padding-base); background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: relative; flex-shrink: 0; z-index: 10;
        }

        .menu-toggle-btn {
            position: absolute; left: var(--padding-base);
            background: transparent; border: none; color: var(--text-color);
            cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; transition: background 0.2s;
        }
        .menu-toggle-btn:hover { background: var(--sidebar-hover); }

        .app-title { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; }
        .header-auth-area { position: absolute; right: var(--padding-base); display: flex; align-items: center; }

        .header-login-text-btn {
            background: transparent; color: var(--text-color); border: none;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; padding: 6px 10px; transition: opacity 0.2s;
        }
        .header-login-text-btn:hover { opacity: 0.8; }

        .user-profile-wrapper { position: relative; }
        .user-avatar-btn {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            background: #334155; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff;
            transition: transform 0.2s;
        }
        .user-avatar-btn:hover { transform: scale(1.05); }

        .user-dropdown-menu {
            position: absolute; right: 0; top: 44px;
            background: var(--modal-bg); border: 1px solid var(--border-color);
            border-radius: 12px; width: 220px; padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 8px;
            opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; z-index: 100;
        }
        .user-dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }

        .dropdown-user-info { display: flex; flex-direction: column; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .dropdown-name { font-size: 0.88rem; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-email { font-size: 0.75rem; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .dropdown-logout-btn {
            background: rgba(239, 68, 68, 0.1); border: none; color: #ef4444; padding: 8px;
            border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; transition: background 0.2s;
        }
        .dropdown-logout-btn:hover { background: rgba(239, 68, 68, 0.2); }

        /* Auth Modal */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            z-index: 10001; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .auth-modal-overlay.active { opacity: 1; visibility: visible; }
        .auth-modal {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 380px; border-radius: 18px; padding: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px;
        }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
        .auth-tab {
            flex: 1; padding: 10px 0; background: transparent; border: none; color: var(--muted-color);
            font-size: 0.95rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .auth-tab.active { color: var(--text-color); border-bottom-color: var(--text-color); }
        .auth-form { display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 0.8rem; color: var(--muted-color); font-weight: 500; }
        .form-input {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; outline: none;
        }
        .auth-submit-btn {
            background: var(--text-color); color: var(--bg-color); border: none; padding: 11px;
            border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 6px;
        }
        .auth-error { color: #ef4444; font-size: 0.8rem; text-align: center; display: none; }

        /* Sidebar */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: 0; 
            width: clamp(280px, 80vw, 310px); height: 100%;
            background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            z-index: 999; display: flex; flex-direction: column; padding: 20px 16px; gap: 14px;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 15px 0 40px rgba(0,0,0,0.3);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-size: 1.05rem; font-weight: 700; color: var(--text-color); }
        .close-sidebar-btn {
            background: transparent; border: none; color: var(--muted-color);
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .close-sidebar-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }

        .search-box-wrapper { position: relative; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .search-icon { position: absolute; left: 0; color: var(--muted-color); pointer-events: none; }
        .search-box { width: 100%; background: transparent; border: none; padding: 8px 8px 8px 26px; color: var(--text-color); font-size: 0.88rem; outline: none; }
        .search-box::placeholder { color: var(--muted-color); }

        .new-chat-item {
            background: transparent; border: none; color: var(--text-color);
            padding: 8px 6px; border-radius: 8px; font-size: 0.9rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; transition: background 0.2s;
        }
        .new-chat-item:hover { background: var(--sidebar-hover); }

        .history-section-title { font-size: 0.7rem; text-transform: uppercase; color: var(--muted-color); font-weight: 700; letter-spacing: 0.8px; margin-top: 4px; padding-left: 4px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
        .history-empty-state { font-size: 0.82rem; color: var(--muted-color); padding: 8px 6px; font-style: italic; }

        .history-item {
            background: transparent; border: none; padding: 8px; border-radius: 8px; font-size: 0.88rem; color: var(--muted-color);
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s ease;
        }
        .history-item:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .history-item.active { background: var(--sidebar-hover); color: var(--text-color); font-weight: 500; }
        .chat-icon { color: var(--muted-color); flex-shrink: 0; }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .item-actions { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.15s; }
        .history-item:hover .item-actions { opacity: 1; }
        .action-icon-btn { background: transparent; border: none; color: var(--muted-color); cursor: pointer; padding: 3px; font-size: 0.8rem; border-radius: 4px; }
        .action-icon-btn:hover { color: var(--text-color); background: var(--border-color); }
        .action-icon-btn.delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.15); }
        .action-icon-btn.pinned { color: #3b82f6; opacity: 1; }

        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-user-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: var(--card-bg); border: 1px solid var(--border-color); margin-bottom: 6px; }
        .sidebar-user-avatar { width: 30px; height: 30px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; }
        .sidebar-user-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .sidebar-user-name { font-size: 0.82rem; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-user-email { font-size: 0.7rem; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sidebar-action-btn {
            background: transparent; border: none; color: var(--muted-color); font-size: 0.85rem; cursor: pointer; padding: 8px; border-radius: 8px; width: 100%; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-action-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .sidebar-action-btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .storage-counter { font-size: 0.7rem; color: var(--muted-color); text-align: center; margin-top: 4px; }

        /* Settings Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .settings-modal {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; border-radius: 16px; padding: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text-color); }
        .close-modal-btn { background: transparent; border: none; color: var(--muted-color); font-size: 1.2rem; cursor: pointer; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
        .setting-label { font-size: 0.9rem; color: var(--text-color); font-weight: 500; }
        .setting-desc { font-size: 0.75rem; color: var(--muted-color); }
        .theme-switch { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 3px; gap: 2px; }
        .theme-option { padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; border: none; background: transparent; color: var(--muted-color); cursor: pointer; }
        .theme-option.active { background: var(--text-color); color: var(--bg-color); }

        /* Chat Area */
        .chat-main {
            flex: 1; width: 100%; max-width: var(--chat-max-width); margin: 0 auto;
            padding: var(--padding-base); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scroll-behavior: smooth;
        }
        .welcome-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; margin: auto 0; padding: 20px;
        }
        .welcome-title { font-size: 1.8rem; font-weight: 700; color: var(--text-color); letter-spacing: -0.5px; }

        .message {
            max-width: 85%; padding: 12px 16px; font-size: 0.98rem; line-height: 1.55;
            border-radius: var(--border-radius); word-wrap: break-word; flex-shrink: 0; position: relative;
        }
        .message.ai { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background-color: var(--user-msg-bg); color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); white-space: pre-wrap; }

        /* Markdown & Highlight Styles */
        .message.ai p { margin-bottom: 8px; }
        .message.ai p:last-child { margin-bottom: 0; }
        .message.ai ul, .message.ai ol { margin-left: 20px; margin-bottom: 8px; }
        .message.ai li { margin-bottom: 4px; }
        .message.ai h1, .message.ai h2, .message.ai h3, .message.ai h4 { font-size: 1.05rem; font-weight: 700; margin: 10px 0 6px 0; color: var(--text-color); }
        .message.ai strong { font-weight: 700; color: var(--text-color); }
        .message.ai pre { background: #040609; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border-color); }
        .message.ai code { font-family: monospace; font-size: 0.88rem; }
        .message.ai p code { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }

        .msg-footer-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .msg-btn { background: transparent; border: none; color: var(--muted-color); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; }
        .msg-btn:hover { color: var(--text-color); }

        /* Typing Indicator Animation */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
        .typing-dots span {
            width: 7px; height: 7px; background: var(--muted-color); border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* Input Section */
        .input-section { width: 100%; max-width: var(--chat-max-width); margin: 0 auto; padding: var(--padding-base); background: var(--bg-color); flex-shrink: 0; }
        .input-box {
            display: flex; align-items: flex-end; gap: 8px; background: var(--card-bg);
            border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        textarea { flex: 1; background: transparent; border: none; color: var(--text-color); font-size: 1rem; outline: none; padding: 6px 4px; resize: none; max-height: 120px; min-height: 22px; line-height: 1.4; }
        textarea::placeholder { color: var(--muted-color); }

        .send-submit {
            background: var(--text-color); color: var(--bg-color); border: none; width: 36px; height: 36px; min-width: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .send-submit:hover { opacity: 0.8; }
        
        .clear-current-chat-btn {
            background: transparent; border: none; color: var(--muted-color); font-size: 0.8rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; transition: all 0.2s;
        }
        .clear-current-chat-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Menu Principal</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn" title="Fechar Menu">✕</button>
            </div>
            
            <div class="search-box-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-box" id="searchBox" placeholder="Pesquisar conversas... (Ctrl+K)">
            </div>

            <button class="new-chat-item" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Conversa
            </button>

            <div class="history-list" id="historyList"></div>

            <div class="sidebar-footer">
                <div id="sidebarUserCardContainer"></div>
                <button class="sidebar-action-btn" id="openSettingsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Configurações
                </button>
                <button class="sidebar-action-btn danger" id="clearHistoryBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Limpar Histórico
                </button>
                <div class="storage-counter" id="storageCounter">0 conversas guardadas</div>
            </div>
        </aside>

        <!-- Auth Modal -->
        <div class="auth-modal-overlay" id="authModalOverlay">
            <div class="auth-modal">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin">Entrar</button>
                    <button class="auth-tab" id="tabRegister">Registrar</button>
                </div>
                <div class="auth-error" id="authErrorMsg"></div>
                <form class="auth-form" id="loginForm">
                    <div class="form-group"><label class="form-label">E-mail</label><input type="email" class="form-input" id="loginEmail" required></div>
                    <div class="form-group"><label class="form-label">Senha</label><input type="password" class="form-input" id="loginPassword" required></div>
                    <button type="submit" class="auth-submit-btn">Entrar</button>
                </form>
                <form class="auth-form" id="registerForm" style="display: none;">
                    <div class="form-group"><label class="form-label">Nome Completo</label><input type="text" class="form-input" id="regName" required></div>
                    <div class="form-group"><label class="form-label">E-mail</label><input type="email" class="form-input" id="regEmail" required></div>
                    <div class="form-group"><label class="form-label">Senha</label><input type="password" class="form-input" id="regPassword" required minlength="6"></div>
                    <button type="submit" class="auth-submit-btn">Criar Conta</button>
                </form>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModalOverlay">
            <div class="settings-modal">
                <div class="modal-header">
                    <span class="modal-title">Configurações</span>
                    <button class="close-modal-btn" id="closeSettingsBtn">✕</button>
                </div>
                <div class="setting-row">
                    <div>
                        <div class="setting-label">Tema da Interface</div>
                        <div class="setting-desc">Alternar entre modo escuro e claro</div>
                    </div>
                    <div class="theme-switch" id="themeSwitch">
                        <button class="theme-option active" id="themeDarkBtn">Escuro</button>
                        <button class="theme-option" id="themeLightBtn">Claro</button>
                    </div>
                </div>
                <div style="font-size: 0.82rem; color: var(--muted-color); border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 4px;">
                    Chronical I.A • Universal v5.0
                </div>
            </div>
        </div>

        <!-- Header -->
        <header>
            <button class="menu-toggle-btn" id="menuToggleBtn" title="Abrir Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="app-title" style="display: flex; align-items: center; gap: 12px;">
                Chronical I.A
                <button class="clear-current-chat-btn" id="clearCurrentChatBtn" title="Limpar conversa atual" style="display:none;">Limpar chat</button>
            </div>
            <div class="header-auth-area" id="headerAuthArea"></div>
        </header>

        <!-- Chat Main -->
        <main class="chat-main" id="chatMain">
            <div class="welcome-container" id="welcomeContainer">
                <h1 class="welcome-title" id="welcomeTitle">Como posso ajudar você hoje?</h1>
            </div>
        </main>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tema
        const htmlElement = document.documentElement;
        const themeDarkBtn = document.getElementById('themeDarkBtn');
        const themeLightBtn = document.getElementById('themeLightBtn');

        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('chronical_theme', theme);
            if (theme === 'light') { themeLightBtn.classList.add('active'); themeDarkBtn.classList.remove('active'); }
            else { themeDarkBtn.classList.add('active'); themeLightBtn.classList.remove('active'); }
        }
        setTheme(localStorage.getItem('chronical_theme') || 'dark');
        themeDarkBtn.onclick = () => setTheme('dark');
        themeLightBtn.onclick = () => setTheme('light');

        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBWXGHYL7ncUvFCp0g14sNQc-QTG756L2Q",
            authDomain: "chronical--ia.firebaseapp.com",
            projectId: "chronical--ia",
            storageBucket: "chronical--ia.firebasestorage.app",
            messagingSenderId: "441734519766",
            appId: "1:441734519766:web:83080edb3b69fc618a2277"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Auth Modal UI
        const authModalOverlay = document.getElementById('authModalOverlay');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authErrorMsg = document.getElementById('authErrorMsg');

        function showError(msg) { authErrorMsg.textContent = msg; authErrorMsg.style.display = 'block'; }
        tabLogin.onclick = () => { tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.style.display = 'flex'; registerForm.style.display = 'none'; };
        tabRegister.onclick = () => { tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.style.display = 'flex'; loginForm.style.display = 'none'; };

        loginForm.onsubmit = (e) => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .then(() => authModalOverlay.classList.remove('active'))
                .catch(() => showError("Dados inválidos."));
        };
        registerForm.onsubmit = (e) => {
            e.preventDefault();
            auth.createUserWithEmailAndPassword(document.getElementById('regEmail').value, document.getElementById('regPassword').value)
                .then(uc => uc.user.updateProfile({ displayName: document.getElementById('regName').value }))
                .then(() => { authModalOverlay.classList.remove('active'); location.reload(); })
                .catch(err => showError(err.message));
        };

        const headerAuthArea = document.getElementById('headerAuthArea');
        const sidebarUserCardContainer = document.getElementById('sidebarUserCardContainer');
        const welcomeTitle = document.getElementById('welcomeTitle');

        auth.onAuthStateChanged(user => {
            if (user) {
                const name = user.displayName || 'Utilizador';
                const initial = name.charAt(0).toUpperCase();
                welcomeTitle.textContent = `Como posso ajudar você, ${name.split(' ')[0]}?`;
                headerAuthArea.innerHTML = `
                    <div class="user-profile-wrapper">
                        <button class="user-avatar-btn" id="userAvatarBtn">${initial}</button>
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <div class="dropdown-user-info"><span class="dropdown-name">${name}</span><span class="dropdown-email">${user.email}</span></div>
                            <button class="dropdown-logout-btn" onclick="auth.signOut()">Terminar Sessão</button>
                        </div>
                    </div>
                `;
                document.getElementById('userAvatarBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('userDropdownMenu').classList.toggle('active'); };
                sidebarUserCardContainer.innerHTML = `<div class="sidebar-user-card"><div class="sidebar-user-avatar">${initial}</div><div class="sidebar-user-info"><span class="sidebar-user-name">${name}</span><span class="sidebar-user-email">${user.email}</span></div></div>`;
            } else {
                headerAuthArea.innerHTML = `<button class="header-login-text-btn" onclick="authModalOverlay.classList.add('active')">Entrar</button>`;
                sidebarUserCardContainer.innerHTML = `<button class="sidebar-action-btn" onclick="authModalOverlay.classList.add('active')">Entrar na Conta</button>`;
            }
        });

        // Chat & History State
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const searchBox = document.getElementById('searchBox');
        const storageCounter = document.getElementById('storageCounter');
        const clearCurrentChatBtn = document.getElementById('clearCurrentChatBtn');

        let chats = JSON.parse(localStorage.getItem('chronical_chats')) || [];
        let currentChatId = localStorage.getItem('chronical_active_id') || null;

        document.getElementById('openSettingsBtn').onclick = () => document.getElementById('settingsModalOverlay').classList.add('active');
        document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModalOverlay').classList.remove('active');

        document.getElementById('menuToggleBtn').onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); searchBox.value = ''; renderHistory(); };
        document.getElementById('closeSidebarBtn').onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };

        // Atalhos de Teclado Globais (Ctrl+K e Esc)
        window.onkeydown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
                searchBox.focus();
            }
            if (e.key === 'Escape') {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
                document.getElementById('settingsModalOverlay').classList.remove('active');
                authModalOverlay.classList.remove('active');
            }
        };

        function renderHistory(filter = '') {
            historyList.innerHTML = '';
            const filtered = chats.filter(c => c.title.toLowerCase().includes(filter.toLowerCase()));
            storageCounter.textContent = `${chats.length} ${chats.length === 1 ? 'conversa guardada' : 'conversas guardadas'}`;
            
            if (filtered.length === 0) {
                historyList.innerHTML = '<div class="history-empty-state">Nenhuma conversa encontrada.</div>';
                return;
            }
            filtered.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<span class="chat-icon">💬</span><span class="history-text">${chat.title}</span>`;
                item.onclick = () => loadChat(chat.id);
                historyList.appendChild(item);
            });
        }

        newChatBtn.onclick = () => {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('chronical_active_id', currentChatId);
            resetToWelcome();
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        };

        function resetToWelcome() {
            chatMain.innerHTML = `<div class="welcome-container" id="welcomeContainer"><h1 class="welcome-title">${welcomeTitle.textContent}</h1></div>`;
            clearCurrentChatBtn.style.display = 'none';
        }

        clearCurrentChatBtn.onclick = () => {
            chats = chats.filter(c => c.id !== currentChatId);
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
            resetToWelcome();
            renderHistory();
        };

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = chat.id;
            localStorage.setItem('chronical_active_id', currentChatId);
            chatMain.innerHTML = '';
            clearCurrentChatBtn.style.display = 'flex';
            chat.messages.forEach(m => appendMessageUI(m.sender, m.text, false));
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        clearHistoryBtn.onclick = () => {
            if (confirm("Tens a certeza que queres limpar todo o histórico?")) {
                chats = [];
                localStorage.removeItem('chronical_chats');
                newChatBtn.click();
            }
        };

        searchBox.oninput = (e) => renderHistory(e.target.value);

        function appendMessageUI(sender, text, animateCode = true) {
            const welcome = document.getElementById('welcomeContainer');
            if (welcome) welcome.remove();
            clearCurrentChatBtn.style.display = 'flex';

            const div = document.createElement('div');
            div.className = `message ${sender}`;

            if (sender === 'ai') {
                div.innerHTML = marked.parse(text);
                if (animateCode) {
                    div.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                }
                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };
                actions.appendChild(copyBtn);
                div.appendChild(actions);
            } else {
                div.textContent = text;
            }

            chatMain.appendChild(div);
            chatMain.scrollTop = chatMain.scrollHeight;
            return div;
        }

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessageUI('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Indicador de escrita animado
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            chatMain.appendChild(aiDiv);
            chatMain.scrollTop = chatMain.scrollHeight;

            // Obter histórico atual da conversa para enviar ao backend
            let chat = chats.find(c => c.id === currentChatId);
            let currentMessagesHistory = chat ? [...chat.messages] : [];
            currentMessagesHistory.push({ sender: 'user', text: text });

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: currentMessagesHistory })
                });

                const data = await response.json();
                const aiReply = data.reply || "Sem resposta.";

                aiDiv.innerHTML = marked.parse(aiReply);
                aiDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(aiReply);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };
                actions.appendChild(copyBtn);
                aiDiv.appendChild(actions);

                // Guardar no localStorage
                if (!currentChatId) currentChatId = 'chat_' + Date.now();
                let activeChat = chats.find(c => c.id === currentChatId);
                if (!activeChat) {
                    activeChat = { id: currentChatId, title: text.substring(0, 28) + '...', messages: [], pinned: false };
                    chats.unshift(activeChat);
                }
                activeChat.messages.push({ sender: 'user', text: text });
                activeChat.messages.push({ sender: 'ai', text: aiReply });
                localStorage.setItem('chronical_chats', JSON.stringify(chats));
                renderHistory();

                chatMain.scrollTop = chatMain.scrollHeight;
            } catch (error) {
                aiDiv.innerHTML = "Erro ao comunicar com o servidor da Chronical I.A.";
            }
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };

        // Carregar chat ativo inicial se existir
        if (currentChatId) {
            loadChat(currentChatId);
        }
    </script>
</body>
</html>
