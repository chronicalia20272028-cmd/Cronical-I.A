<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Marcador de Markdown para formatação perfeita -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --font-size: 14px;
            --header-height: 56px;
            --chat-max-width: 800px;
            --padding-base: 16px;
            --border-radius: 14px;

            /* Tema Escuro */
            --bg-color: #000000;
            --text-color: #f1f5f9;
            --sidebar-bg: #040609;
            --sidebar-hover: rgba(255, 255, 255, 0.05);
            --card-bg: #0b0f19;
            --border-color: rgba(255, 255, 255, 0.06);
            --muted-color: #64748b;
            --input-bg: #0b0f19;
            --user-msg-bg: #2563eb;
            --modal-bg: #080b11;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sidebar-bg: #ffffff;
            --sidebar-hover: rgba(0, 0, 0, 0.04);
            --card-bg: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.08);
            --muted-color: #64748b;
            --input-bg: #ffffff;
            --user-msg-bg: #2563eb;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100vh; height: 100dvh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; font-size: var(--font-size);
            transition: background-color 0.2s, color 0.2s;
        }

        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }

        /* --- CABEÇALHO --- */
        header {
            height: var(--header-height); min-height: var(--header-height);
            display: flex; align-items: center; justify-content: center;
            padding: 0 var(--padding-base); background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: relative; flex-shrink: 0; z-index: 10;
        }

        .menu-toggle-btn {
            position: absolute; left: var(--padding-base);
            background: transparent; border: none; color: var(--text-color);
            cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; transition: background 0.2s;
        }
        .menu-toggle-btn:hover { background: var(--sidebar-hover); }

        .app-title { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; }

        .header-auth-area { position: absolute; right: var(--padding-base); display: flex; align-items: center; }

        .header-login-text-btn {
            background: transparent; color: var(--text-color); border: none;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; padding: 6px 10px; transition: opacity 0.2s;
        }
        .header-login-text-btn:hover { opacity: 0.8; }

        .user-profile-wrapper { position: relative; }

        .user-avatar-btn {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            background: #334155; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff;
            transition: transform 0.2s;
        }
        .user-avatar-btn:hover { transform: scale(1.05); }

        .user-dropdown-menu {
            position: absolute; right: 0; top: 44px;
            background: var(--modal-bg); border: 1px solid var(--border-color);
            border-radius: 12px; width: 220px; padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 8px;
            opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; z-index: 100;
        }
        .user-dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }

        .dropdown-user-info { display: flex; flex-direction: column; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .dropdown-name { font-size: 0.88rem; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dropdown-email { font-size: 0.75rem; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .dropdown-logout-btn {
            background: rgba(239, 68, 68, 0.1); border: none; color: #ef4444; padding: 8px;
            border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; transition: background 0.2s;
        }
        .dropdown-logout-btn:hover { background: rgba(239, 68, 68, 0.2); }

        /* --- MODAL DE AUTENTICAÇÃO --- */
        .auth-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            z-index: 10001; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .auth-modal-overlay.active { opacity: 1; visibility: visible; }

        .auth-modal {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 380px; border-radius: 18px; padding: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px;
        }

        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
        .auth-tab {
            flex: 1; padding: 10px 0; background: transparent; border: none; color: var(--muted-color);
            font-size: 0.95rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .auth-tab.active { color: var(--text-color); border-bottom-color: var(--text-color); }

        .auth-form { display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 0.8rem; color: var(--muted-color); font-weight: 500; }
        .form-input {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; outline: none; transition: background 0.2s;
        }

        .auth-submit-btn {
            background: var(--text-color); color: var(--bg-color); border: none; padding: 11px;
            border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 6px; transition: opacity 0.2s;
        }
        .auth-submit-btn:hover { opacity: 0.9; }

        .divider { display: flex; align-items: center; text-align: center; color: var(--muted-color); font-size: 0.75rem; margin: 4px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider::before { margin-right: .8em; } .divider::after { margin-left: .8em; }

        .google-auth-btn {
            background: var(--sidebar-hover); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 10px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s;
        }
        .google-auth-btn:hover { background: var(--border-color); }

        .auth-error { color: #ef4444; font-size: 0.8rem; text-align: center; display: none; }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: 0; 
            width: clamp(280px, 80vw, 310px); height: 100%;
            background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            z-index: 999; display: flex; flex-direction: column; padding: 20px 16px; gap: 14px;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s;
            box-shadow: 15px 0 40px rgba(0,0,0,0.3);
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-size: 1.05rem; font-weight: 700; color: var(--text-color); letter-spacing: 0.3px; }
        .close-sidebar-btn {
            background: transparent; border: none; color: var(--muted-color);
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .close-sidebar-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }

        .search-box-wrapper { position: relative; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .search-icon { position: absolute; left: 0; color: var(--muted-color); pointer-events: none; }
        .search-box { width: 100%; background: transparent; border: none; padding: 8px 8px 8px 26px; color: var(--text-color); font-size: 0.88rem; outline: none; }
        .search-box::placeholder { color: var(--muted-color); }

        .new-chat-item {
            background: transparent; border: none; color: var(--text-color);
            padding: 8px 6px; border-radius: 8px; font-size: 0.9rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; transition: background 0.2s;
        }
        .new-chat-item:hover { background: var(--sidebar-hover); }
        .new-chat-item svg { color: var(--muted-color); transition: color 0.2s; }
        .new-chat-item:hover svg { color: var(--text-color); }

        .history-section-title { font-size: 0.7rem; text-transform: uppercase; color: var(--muted-color); font-weight: 700; letter-spacing: 0.8px; margin-top: 4px; padding-left: 4px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .history-empty-state { font-size: 0.82rem; color: var(--muted-color); padding: 8px 6px; font-style: italic; }

        .history-item {
            background: transparent; border: none; padding: 8px; border-radius: 8px; font-size: 0.88rem; color: var(--muted-color);
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s ease;
        }
        .history-item:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .history-item.active { background: var(--sidebar-hover); color: var(--text-color); font-weight: 500; }

        .chat-icon { color: var(--muted-color); flex-shrink: 0; }
        .history-item:hover .chat-icon, .history-item.active .chat-icon { color: var(--text-color); }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .item-actions { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.15s; }
        .history-item:hover .item-actions { opacity: 1; }
        .action-icon-btn { background: transparent; border: none; color: var(--muted-color); cursor: pointer; padding: 3px; font-size: 0.8rem; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .action-icon-btn:hover { color: var(--text-color); background: var(--border-color); }
        .action-icon-btn.delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.15); }
        .action-icon-btn.pinned { color: #3b82f6; opacity: 1; }

        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-user-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: var(--card-bg); margin-bottom: 6px; border: 1px solid var(--border-color); }
        .sidebar-user-avatar { width: 30px; height: 30px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
        .sidebar-user-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .sidebar-user-name { font-size: 0.82rem; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-user-email { font-size: 0.7rem; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sidebar-action-btn {
            background: transparent; border: none; color: var(--muted-color); font-size: 0.85rem; font-weight: 400; cursor: pointer; padding: 8px; border-radius: 8px; width: 100%; display: flex; align-items: center; gap: 10px; transition: background 0.15s, color 0.15s;
        }
        .sidebar-action-btn svg { color: var(--muted-color); }
        .sidebar-action-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .sidebar-action-btn:hover svg { color: var(--text-color); }
        .sidebar-action-btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .sidebar-action-btn.danger:hover svg { color: #ef4444; }
        .storage-counter { font-size: 0.7rem; color: var(--muted-color); text-align: center; margin-top: 4px; }

        /* --- MODAL DE CONFIGURAÇÕES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .settings-modal {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; border-radius: 16px; padding: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text-color); }
        .close-modal-btn { background: transparent; border: none; color: var(--muted-color); font-size: 1.2rem; cursor: pointer; }

        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
        .setting-label { font-size: 0.9rem; color: var(--text-color); font-weight: 500; }
        .setting-desc { font-size: 0.75rem; color: var(--muted-color); }

        .theme-switch { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 3px; cursor: pointer; gap: 2px; }
        .theme-option { padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; border: none; background: transparent; color: var(--muted-color); cursor: pointer; transition: all 0.2s; }
        .theme-option.active { background: var(--text-color); color: var(--bg-color); }

        /* --- ÁREA DE CHAT & TELA INICIAL --- */
        .chat-main {
            flex: 1; width: 100%; max-width: var(--chat-max-width); margin: 0 auto;
            padding: var(--padding-base); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scroll-behavior: smooth;
        }

        .welcome-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; margin: auto 0; padding: 20px;
        }
        .welcome-title { font-size: 1.8rem; font-weight: 700; color: var(--text-color); letter-spacing: -0.5px; }

        .message {
            max-width: 85%; padding: 12px 16px; font-size: 0.98rem; line-height: 1.55;
            border-radius: var(--border-radius); word-wrap: break-word; flex-shrink: 0;
            position: relative;
        }
        .message.ai { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background-color: var(--user-msg-bg); color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); white-space: pre-wrap; }

        /* Estilização para Markdown renderizado nas mensagens da IA */
        .message.ai p { margin-bottom: 8px; }
        .message.ai p:last-child { margin-bottom: 0; }
        .message.ai ul, .message.ai ol { margin-left: 20px; margin-bottom: 8px; }
        .message.ai li { margin-bottom: 4px; }
        .message.ai h1, .message.ai h2, .message.ai h3, .message.ai h4 { font-size: 1.05rem; font-weight: 700; margin: 10px 0 6px 0; color: var(--text-color); }
        .message.ai strong { font-weight: 700; color: var(--text-color); }

        .msg-footer-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .msg-btn { background: transparent; border: none; color: var(--muted-color); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; transition: color 0.2s; }
        .msg-btn:hover { color: var(--text-color); }

        /* Zona de Input */
        .input-section { width: 100%; max-width: var(--chat-max-width); margin: 0 auto; padding: var(--padding-base); background: var(--bg-color); flex-shrink: 0; }
        .input-box {
            display: flex; align-items: flex-end; gap: 8px; background: var(--card-bg);
            border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        textarea { flex: 1; background: transparent; border: none; color: var(--text-color); font-size: 1rem; outline: none; padding: 6px 4px; resize: none; max-height: 120px; min-height: 22px; line-height: 1.4; }
        textarea::placeholder { color: var(--muted-color); }

        .send-submit {
            background: var(--text-color); color: var(--bg-color); border: none; width: 36px; height: 36px; min-width: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity 0.2s;
        }
        .send-submit:hover { opacity: 0.8; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Menu Lateral -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Menu Principal</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn" title="Fechar Menu">✕</button>
            </div>
            
            <div class="search-box-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-box" id="searchBox" placeholder="Pesquisar conversas...">
            </div>

            <button class="new-chat-item" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Conversa
            </button>

            <div class="history-list" id="historyList"></div>

            <div class="sidebar-footer">
                <div id="sidebarUserCardContainer"></div>

                <button class="sidebar-action-btn" id="openSettingsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Configurações
                </button>
                <button class="sidebar-action-btn danger" id="clearHistoryBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Limpar Histórico
                </button>
                <div class="storage-counter" id="storageCounter">0 conversas guardadas</div>
            </div>
        </aside>

        <!-- Modal de Autenticação -->
        <div class="auth-modal-overlay" id="authModalOverlay">
            <div class="auth-modal">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin">Entrar</button>
                    <button class="auth-tab" id="tabRegister">Registrar</button>
                </div>

                <div class="auth-error" id="authErrorMsg"></div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="auth-submit-btn">Entrar</button>
                </form>

                <form class="auth-form" id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-input" id="regName" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="auth-submit-btn">Criar Conta</button>
                </form>

                <div class="divider">ou</div>

                <button class="google-auth-btn" id="googleModalBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
                    Continuar com o Google
                </button>
            </div>
        </div>

        <!-- Modal de Configurações -->
        <div class="modal-overlay" id="settingsModalOverlay">
            <div class="settings-modal">
                <div class="modal-header">
                    <span class="modal-title">Configurações</span>
                    <button class="close-modal-btn" id="closeSettingsBtn">✕</button>
                </div>
                
                <div class="setting-row">
                    <div>
                        <div class="setting-label">Tema da Interface</div>
                        <div class="setting-desc">Alternar entre modo escuro e claro</div>
                    </div>
                    <div class="theme-switch" id="themeSwitch">
                        <button class="theme-option active" id="themeDarkBtn">Escuro</button>
                        <button class="theme-option" id="themeLightBtn">Claro</button>
                    </div>
                </div>

                <div style="font-size: 0.82rem; color: var(--muted-color); border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 4px;">
                    Chronical I.A • Assistente Inteligente Universal v4.2
                </div>
            </div>
        </div>

        <!-- Cabeçalho -->
        <header>
            <button class="menu-toggle-btn" id="menuToggleBtn" title="Abrir Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <div class="app-title">Chronical I.A</div>

            <div class="header-auth-area" id="headerAuthArea"></div>
        </header>

        <!-- Mensagens do Chat -->
        <main class="chat-main" id="chatMain">
            <div class="welcome-container" id="welcomeContainer">
                <h1 class="welcome-title" id="welcomeTitle">Como posso ajudar você hoje?</h1>
            </div>
        </main>

        <!-- Barra de Input -->
        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- GERENCIAMENTO DE TEMA ---
        const htmlElement = document.documentElement;
        const themeDarkBtn = document.getElementById('themeDarkBtn');
        const themeLightBtn = document.getElementById('themeLightBtn');

        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('chronical_theme', theme);
            if (theme === 'light') {
                themeLightBtn.classList.add('active'); themeDarkBtn.classList.remove('active');
            } else {
                themeDarkBtn.classList.add('active'); themeLightBtn.classList.remove('active');
            }
        }
        setTheme(localStorage.getItem('chronical_theme') || 'dark');
        themeDarkBtn.onclick = () => setTheme('dark');
        themeLightBtn.onclick = () => setTheme('light');

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBWXGHYL7ncUvFCp0g14sNQc-QTG756L2Q",
            authDomain: "chronical--ia.firebaseapp.com",
            projectId: "chronical--ia",
            storageBucket: "chronical--ia.firebasestorage.app",
            messagingSenderId: "441734519766",
            appId: "1:441734519766:web:83080edb3b69fc618a2277",
            measurementId: "G-E8DR0V8VQJ"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- AUTH MODAL ---
        const authModalOverlay = document.getElementById('authModalOverlay');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authErrorMsg = document.getElementById('authErrorMsg');

        function showError(msg) { authErrorMsg.textContent = msg; authErrorMsg.style.display = 'block'; }
        function clearError() { authErrorMsg.textContent = ''; authErrorMsg.style.display = 'none'; }

        tabLogin.onclick = () => { tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.style.display = 'flex'; registerForm.style.display = 'none'; clearError(); };
        tabRegister.onclick = () => { tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.style.display = 'flex'; loginForm.style.display = 'none'; clearError(); };
        authModalOverlay.onclick = (e) => { if (e.target === authModalOverlay) authModalOverlay.classList.remove('active'); };

        loginForm.onsubmit = (e) => {
            e.preventDefault(); clearError();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .then(() => { authModalOverlay.classList.remove('active'); loginForm.reset(); })
                .catch(() => showError("E-mail ou senha incorretos."));
        };

        registerForm.onsubmit = (e) => {
            e.preventDefault(); clearError();
            const name = document.getElementById('regName').value;
            auth.createUserWithEmailAndPassword(document.getElementById('regEmail').value, document.getElementById('regPassword').value)
                .then(uc => uc.user.updateProfile({ displayName: name }))
                .then(() => { authModalOverlay.classList.remove('active'); registerForm.reset(); location.reload(); })
                .catch(err => showError(err.message || "Erro ao criar conta."));
        };

        document.getElementById('googleModalBtn').onclick = () => {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
                .then(() => authModalOverlay.classList.remove('active'))
                .catch(() => showError("Erro ao fazer login com o Google."));
        };

        const headerAuthArea = document.getElementById('headerAuthArea');
        const sidebarUserCardContainer = document.getElementById('sidebarUserCardContainer');
        const welcomeTitle = document.getElementById('welcomeTitle');

        function updateHeaderAuthUI(user) {
            if (user) {
                const name = user.displayName || 'Utilizador';
                const initial = name.charAt(0).toUpperCase();
                welcomeTitle.textContent = `Como posso ajudar você, ${name.split(' ')[0]}?`;

                headerAuthArea.innerHTML = `
                    <div class="user-profile-wrapper">
                        ${user.photoURL ? `<img class="user-avatar-btn" id="userAvatarBtn" src="${user.photoURL}">` : `<div class="user-avatar-btn" id="userAvatarBtn">${initial}</div>`}
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <div class="dropdown-user-info">
                                <span class="dropdown-name">${name}</span>
                                <span class="dropdown-email">${user.email || ''}</span>
                            </div>
                            <button class="dropdown-logout-btn" id="logoutBtn">Terminar Sessão</button>
                        </div>
                    </div>
                `;
                const avatarBtn = document.getElementById('userAvatarBtn');
                const dropdownMenu = document.getElementById('userDropdownMenu');
                avatarBtn.onclick = (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); };
                window.onclick = () => dropdownMenu.classList.remove('active');
                document.getElementById('logoutBtn').onclick = () => auth.signOut();

                sidebarUserCardContainer.innerHTML = `
                    <div class="sidebar-user-card">
                        <div class="sidebar-user-avatar">${initial}</div>
                        <div class="sidebar-user-info">
                            <span class="sidebar-user-name">${name}</span>
                            <span class="sidebar-user-email">${user.email || ''}</span>
                        </div>
                    </div>
                `;
            } else {
                welcomeTitle.textContent = "Como posso ajudar você hoje?";
                headerAuthArea.innerHTML = `<button class="header-login-text-btn" id="headerLoginTextBtn">Entrar</button>`;
                document.getElementById('headerLoginTextBtn').onclick = () => authModalOverlay.classList.add('active');
                sidebarUserCardContainer.innerHTML = `
                    <button class="sidebar-action-btn" onclick="document.getElementById('authModalOverlay').classList.add('active');">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        Entrar na Conta
                    </button>
                `;
            }
        }
        auth.onAuthStateChanged(user => updateHeaderAuthUI(user));

        // --- SIDEBAR, HISTÓRICO & CHAT ---
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const searchBox = document.getElementById('searchBox');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsModalOverlay = document.getElementById('settingsModalOverlay');
        const storageCounter = document.getElementById('storageCounter');

        let chats = JSON.parse(localStorage.getItem('chronical_chats')) || [];
        let currentChatId = localStorage.getItem('chronical_active_id') || null;

        openSettingsBtn.onclick = () => settingsModalOverlay.classList.add('active');
        closeSettingsBtn.onclick = () => settingsModalOverlay.classList.remove('active');
        settingsModalOverlay.onclick = (e) => { if (e.target === settingsModalOverlay) settingsModalOverlay.classList.remove('active'); };

        menuToggleBtn.onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); searchBox.value = ''; renderHistory(); };
        closeSidebarBtn.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };

        function renderHistory(filterText = '') {
            historyList.innerHTML = '';
            const filteredChats = chats.filter(chat => chat.title.toLowerCase().includes(filterText.toLowerCase()));
            
            storageCounter.textContent = `${chats.length} ${chats.length === 1 ? 'conversa guardada' : 'conversas guardadas'}`;

            if (filteredChats.length === 0) {
                historyList.innerHTML = '<div class="history-empty-state">Nenhuma conversa encontrada.</div>';
                return;
            }

            const pinnedChats = filteredChats.filter(c => c.pinned);
            const recentChats = filteredChats.filter(c => !c.pinned);

            if (pinnedChats.length > 0) {
                const pinnedTitle = document.createElement('div');
                pinnedTitle.className = 'history-section-title';
                pinnedTitle.textContent = 'Fixadas';
                historyList.appendChild(pinnedTitle);
                pinnedChats.forEach(chat => historyList.appendChild(createChatElement(chat, true)));
            }

            if (recentChats.length > 0) {
                const recentTitle = document.createElement('div');
                recentTitle.className = 'history-section-title';
                recentTitle.textContent = 'Recentes';
                historyList.appendChild(recentTitle);
                recentChats.forEach(chat => historyList.appendChild(createChatElement(chat, false)));
            }
        }

        function createChatElement(chat, isPinned) {
            const item = document.createElement('div');
            item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
            
            const chatIcon = document.createElement('span');
            chatIcon.className = 'chat-icon';
            chatIcon.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;

            const textSpan = document.createElement('span');
            textSpan.className = 'history-text';
            textSpan.textContent = chat.title;
            textSpan.onclick = () => loadChat(chat.id);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';

            const pinBtn = document.createElement('button');
            pinBtn.className = `action-icon-btn ${isPinned ? 'pinned' : ''}`;
            pinBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="${isPinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            pinBtn.title = isPinned ? 'Desfixar' : 'Fixar conversa';
            pinBtn.onclick = (e) => { e.stopPropagation(); togglePinChat(chat.id); };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-icon-btn delete';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = 'Apagar conversa';
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };

            actionsDiv.appendChild(pinBtn);
            actionsDiv.appendChild(deleteBtn);

            item.appendChild(chatIcon);
            item.appendChild(textSpan);
            item.appendChild(actionsDiv);
            return item;
        }

        searchBox.oninput = (e) => renderHistory(e.target.value);

        newChatBtn.onclick = () => {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('chronical_active_id', currentChatId);
            resetToWelcomeScreen();
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            searchBox.value = '';
        };

        function resetToWelcomeScreen() {
            const user = auth.currentUser;
            const name = user ? user.displayName || 'Utilizador' : '';
            const greeting = name ? `Como posso ajudar você, ${name.split(' ')[0]}?` : "Como posso ajudar você hoje?";

            chatMain.innerHTML = `
                <div class="welcome-container" id="welcomeContainer">
                    <h1 class="welcome-title">${greeting}</h1>
                </div>
            `;
        }

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = chat.id;
            localStorage.setItem('chronical_active_id', currentChatId);
            chatMain.innerHTML = '';
            chat.messages.forEach(msg => appendMessageUI(msg.sender, msg.text));
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        function togglePinChat(id) {
            const chat = chats.find(c => c.id === id);
            if (chat) {
                chat.pinned = !chat.pinned;
                localStorage.setItem('chronical_chats', JSON.stringify(chats));
                renderHistory(searchBox.value);
            }
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
            if (currentChatId === id) newChatBtn.click();
            else renderHistory(searchBox.value);
        }

        clearHistoryBtn.onclick = () => {
            if (confirm("Tens a certeza que queres limpar todo o histórico de conversas?")) {
                chats = [];
                localStorage.removeItem('chronical_chats');
                newChatBtn.click();
            }
        };

        function saveMessageToCurrentChat(userText, aiText) {
            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                localStorage.setItem('chronical_active_id', currentChatId);
            }
            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { id: currentChatId, title: userText.substring(0, 28) + '...', messages: [], pinned: false };
                chats.unshift(chat);
            }
            chat.messages.push({ sender: 'user', text: userText });
            chat.messages.push({ sender: 'ai', text: aiText });
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
        }

        function appendMessageUI(sender, text) {
            const welcome = document.getElementById('welcomeContainer');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${sender}`;

            if (sender === 'ai') {
                div.innerHTML = marked.parse(text);
                
                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };

                actions.appendChild(copyBtn);
                div.appendChild(actions);
            } else {
                div.textContent = text;
            }

            chatMain.appendChild(div);
            chatMain.scrollTop = chatMain.scrollHeight;
            return div;
        }

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        // --- ENVIAR MENSAGEM ---
        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessageUI('user', text);

            userInput.value = '';
            userInput.style.height = 'auto';

            const aiDiv = appendMessageUI('ai', 'A pensar...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const aiReply = data.reply || "Sem resposta do servidor.";

                // Atualizar com a resposta formatada em Markdown
                aiDiv.innerHTML = marked.parse(aiReply);

                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(aiReply);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };
                actions.appendChild(copyBtn);
                aiDiv.appendChild(actions);

                saveMessageToCurrentChat(text, aiReply);
                chatMain.scrollTop = chatMain.scrollHeight;
            } catch (error) {
                aiDiv.innerHTML = "Erro ao comunicar com o servidor da Chronical I.A.";
            }
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
