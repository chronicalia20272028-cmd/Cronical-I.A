<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A.</title>
    <style>
        :root {
            /* O tamanho da fonte e espaçamento adaptam-se milimetricamente de smartwatches a TVs 4K */
            --font-size: clamp(9px, 1.6vw, 18px);
            --spacing: clamp(3px, 1vw, 14px);
            --border-radius: clamp(4px, 1.5vw, 12px);
            
            --bg-color: #030712;
            --panel-bg: #111827;
            --text-main: #f9fafb;
            --border-color: #1f2937;
            --user-bubble: #2563eb;
            --ai-bubble: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Contentor Mestre: Centraliza em ecrãs grandes (PCs/TVs) e preenche 100% em ecrãs minúsculos (Smartwatches/Telemóveis) */
        .screen-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: var(--spacing);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 98vh;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .chat-header {
            padding: var(--spacing);
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            font-size: var(--font-size);
            font-weight: bold;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
        }

        .message {
            padding: calc(var(--spacing) * 0.8) calc(var(--spacing) * 1.2);
            border-radius: var(--border-radius);
            font-size: var(--font-size);
            max-width: 88%;
            word-break: break-word;
            line-height: 1.4;
        }

        .user-message {
            background-color: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--ai-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .chat-input-area {
            display: flex;
            gap: var(--spacing);
            padding: var(--spacing);
            background-color: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-area input {
            flex: 1;
            padding: var(--spacing);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: var(--font-size);
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #3b82f6;
        }

        .chat-input-area button {
            padding: var(--spacing) calc(var(--spacing) * 1.5);
            border-radius: var(--border-radius);
            border: none;
            background-color: #2563eb;
            color: white;
            font-size: var(--font-size);
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .chat-input-area button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="screen-wrapper">
        <div class="chat-container">
            <div class="chat-header">Chronical I.A.</div>
            <div id="chatMessages" class="chat-messages">
                <div class="message ai-message">Olá! Como posso ajudar você hoje?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escreva a sua mensagem..." autocomplete="off">
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Adicionar mensagem do utilizador ao chat
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Requisição para o backend FastAPI (ajuste a rota '/chat' se necessário para a que configurou no Python)
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = data.response || data.reply || "Resposta recebida.";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = "Erro ao comunicar com o servidor.";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
