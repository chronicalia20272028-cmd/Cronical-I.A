<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A - Assistente Virtual Inteligente</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://api.iconify.design/lucide:bot.svg?color=%232563eb">
    <meta name="google-site-verification" content="RTk2iyL1IPrMR9r0lSAnelie5gPdjB-ddA5DJ5s2mg4" />
    <meta name="description" content="Chronical I.A - Assistente virtual de inteligência artificial avançada com voz e multimodality.">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <!-- Markdown e Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --font-size: 14px;
            --header-height: 56px;
            --chat-max-width: 800px;
            --padding-base: 16px;
            --border-radius: 14px;
            --bg-color: #000000;
            --text-color: #f1f5f9;
            --sidebar-bg: #040609;
            --sidebar-hover: rgba(255, 255, 255, 0.05);
            --card-bg: #0b0f19;
            --border-color: rgba(255, 255, 255, 0.06);
            --muted-color: #64748b;
            --user-msg-bg: #2563eb;
            --modal-bg: #080b11;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sidebar-bg: #ffffff;
            --sidebar-hover: rgba(0, 0, 0, 0.04);
            --card-bg: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.08);
            --muted-color: #64748b;
            --user-msg-bg: #2563eb;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100vh; height: 100dvh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; font-size: var(--font-size);
        }

        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }

        header {
            height: var(--header-height); min-height: var(--header-height);
            display: flex; align-items: center; justify-content: center;
            padding: 0 var(--padding-base); background: var(--bg-color);
            border-bottom: 1px solid var(--border-color); position: relative; flex-shrink: 0; z-index: 10;
        }

        .menu-toggle-btn {
            position: absolute; left: var(--padding-base); background: transparent; border: none;
            color: var(--text-color); cursor: pointer; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .menu-toggle-btn:hover { background: var(--sidebar-hover); }

        .app-title { font-size: 1.15rem; font-weight: 700; }
        .header-auth-area { position: absolute; right: var(--padding-base); display: flex; align-items: center; }

        .header-login-text-btn { background: transparent; color: var(--text-color); border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; padding: 6px 10px; }

        .user-profile-wrapper { position: relative; }
        .user-avatar-btn {
            width: 34px; height: 34px; border-radius: 50%; background: #334155; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff;
        }

        .user-dropdown-menu {
            position: absolute; right: 0; top: 44px; background: var(--modal-bg); border: 1px solid var(--border-color);
            border-radius: 12px; width: 220px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 8px;
            opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; z-index: 100;
        }
        .user-dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-user-info { display: flex; flex-direction: column; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .dropdown-name { font-size: 0.88rem; font-weight: 600; }
        .dropdown-email { font-size: 0.75rem; color: var(--muted-color); }
        .dropdown-logout-btn { background: rgba(239, 68, 68, 0.1); border: none; color: #ef4444; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; }

        /* Sidebar */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: clamp(280px, 80vw, 310px); height: 100%;
            background: var(--sidebar-bg); border-right: 1px solid var(--border-color); z-index: 999;
            display: flex; flex-direction: column; padding: 20px 16px; gap: 14px; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-size: 1.05rem; font-weight: 700; }
        .close-sidebar-btn { background: transparent; border: none; color: var(--muted-color); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-sidebar-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }

        .search-box-wrapper { position: relative; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .search-icon { position: absolute; left: 0; color: var(--muted-color); pointer-events: none; }
        .search-box { width: 100%; background: transparent; border: none; padding: 8px 8px 8px 26px; color: var(--text-color); font-size: 0.88rem; outline: none; }
        .search-box::placeholder { color: var(--muted-color); }

        .new-chat-item { background: transparent; border: none; color: var(--text-color); padding: 8px 6px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
        .new-chat-item:hover { background: var(--sidebar-hover); }

        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .history-empty-state { font-size: 0.82rem; color: var(--muted-color); padding: 8px 6px; font-style: italic; }

        .history-item { background: transparent; border: none; padding: 8px; border-radius: 8px; font-size: 0.88rem; color: var(--muted-color); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .history-item:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .history-item.active { background: var(--sidebar-hover); color: var(--text-color); font-weight: 500; }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-user-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: var(--card-bg); border: 1px solid var(--border-color); margin-bottom: 6px; }
        .sidebar-user-avatar { width: 30px; height: 30px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; }
        .sidebar-user-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .sidebar-user-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-user-email { font-size: 0.7rem; color: var(--muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sidebar-action-btn { background: transparent; border: none; color: var(--muted-color); font-size: 0.85rem; cursor: pointer; padding: 8px; border-radius: 8px; width: 100%; display: flex; align-items: center; gap: 10px; }
        .sidebar-action-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .sidebar-action-btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .storage-counter { font-size: 0.7rem; color: var(--muted-color); text-align: center; margin-top: 4px; }

        /* Auth & Settings Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: var(--modal-bg); border: 1px solid var(--border-color); width: 100%; max-width: 380px; border-radius: 18px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-title { font-size: 1.05rem; font-weight: 700; }
        .close-modal-btn { background: transparent; border: none; color: var(--muted-color); font-size: 1.2rem; cursor: pointer; }

        /* Attachment Menu Popover */
        .attachment-menu {
            position: absolute; bottom: 70px; left: var(--padding-base); background: var(--modal-bg);
            border: 1px solid var(--border-color); border-radius: 12px; width: 200px; padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 4px;
            opacity: 0; visibility: hidden; transform: translateY(8px); transition: all 0.2s ease; z-index: 100;
        }
        .attachment-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .attachment-option {
            background: transparent; border: none; color: var(--text-color); padding: 9px 12px;
            border-radius: 8px; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left;
        }
        .attachment-option:hover { background: var(--sidebar-hover); }

        /* Image Preview Box inside Input */
        .image-preview-container {
            display: none; align-items: center; gap: 10px; padding: 8px 12px;
            background: var(--card-bg); border-top: 1px solid var(--border-color); border-radius: 14px 14px 0 0;
        }
        .image-preview-container.active { display: flex; }
        .preview-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
        .preview-info { font-size: 0.82rem; color: var(--muted-color); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .remove-preview-btn { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; padding: 4px; }

        /* Chat Main & Messages */
        .chat-main { flex: 1; width: 100%; max-width: var(--chat-max-width); margin: 0 auto; padding: var(--padding-base); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scroll-behavior: smooth; }
        .welcome-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; margin: auto 0; padding: 20px; }
        .welcome-title { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }

        .message { max-width: 85%; padding: 12px 16px; font-size: 0.98rem; line-height: 1.55; border-radius: var(--border-radius); word-wrap: break-word; flex-shrink: 0; position: relative; }
        .message.ai { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background-color: var(--user-msg-bg); color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); white-space: pre-wrap; }

        .msg-image { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 8px; display: block; object-fit: contain; }

        /* Markdown & Highlight */
        .message.ai p { margin-bottom: 8px; }
        .message.ai p:last-child { margin-bottom: 0; }
        .message.ai ul, .message.ai ol { margin-left: 20px; margin-bottom: 8px; }
        .message.ai pre { background: #040609; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border-color); }
        .message.ai code { font-family: monospace; font-size: 0.88rem; }
        .message.ai p code { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }

        .msg-footer-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .msg-btn { background: transparent; border: none; color: var(--muted-color); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; }
        .msg-btn:hover { color: var(--text-color); }

        /* Typing Dots */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
        .typing-dots span { width: 7px; height: 7px; background: var(--muted-color); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* Input Section */
        .input-section { width: 100%; max-width: var(--chat-max-width); margin: 0 auto; padding: var(--padding-base); background: var(--bg-color); flex-shrink: 0; position: relative; }
        .input-box-wrapper { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .input-box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px; }
        
        .attach-btn, .mic-btn { background: transparent; border: none; color: var(--muted-color); width: 36px; height: 36px; min-width: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 0.2s, background 0.2s; }
        .attach-btn:hover, .mic-btn:hover { color: var(--text-color); background: var(--sidebar-hover); }
        .mic-btn.recording { color: #ef4444; animation: pulse-mic 1.2s infinite; }
        @keyframes pulse-mic { 0% { transform: scale(1); background: rgba(239, 68, 68, 0.15); } 50% { transform: scale(1.1); background: rgba(239, 68, 68, 0.3); } 100% { transform: scale(1); background: rgba(239, 68, 68, 0.15); } }

        textarea { flex: 1; background: transparent; border: none; color: var(--text-color); font-size: 1rem; outline: none; padding: 6px 4px; resize: none; max-height: 120px; min-height: 22px; line-height: 1.4; }
        textarea::placeholder { color: var(--muted-color); }

        .send-submit { background: var(--text-color); color: var(--bg-color); border: none; width: 36px; height: 36px; min-width: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-submit:hover { opacity: 0.8; }
        
        .clear-current-chat-btn { background: transparent; border: none; color: var(--muted-color); font-size: 0.8rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; display: none; align-items: center; gap: 4px; }
        .clear-current-chat-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Menu Principal</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
            </div>
            
            <div class="search-box-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-box" id="searchBox" placeholder="Pesquisar (Ctrl+K)...">
            </div>

            <button class="new-chat-item" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nova Conversa
            </button>

            <div class="history-list" id="historyList"></div>

            <div class="sidebar-footer">
                <div id="sidebarUserCardContainer"></div>
                <button class="sidebar-action-btn" id="exportChatBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Exportar Conversa Atual (.md)
                </button>
                <button class="sidebar-action-btn" id="openSettingsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Configurações
                </button>
                <button class="sidebar-action-btn danger" id="clearHistoryBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Limpar Histórico
                </button>
                <div class="storage-counter" id="storageCounter">0 conversas guardadas</div>
            </div>
        </aside>

        <!-- Auth Modal -->
        <div class="modal-overlay" id="authModalOverlay">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title" id="authModalTitle">Entrar na Conta</span>
                    <button class="close-modal-btn" onclick="document.getElementById('authModalOverlay').classList.remove('active')">✕</button>
                </div>
                <form class="auth-form" id="loginForm" style="display:flex; flex-direction:column; gap:12px;">
                    <div style="font-size:0.85rem; color:var(--muted-color);">Insira os seus dados para entrar:</div>
                    <input type="email" class="search-box" id="loginEmail" placeholder="E-mail" style="border:1px solid var(--border-color); border-radius:8px; padding:10px;" required>
                    <input type="password" class="search-box" id="loginPassword" placeholder="Senha" style="border:1px solid var(--border-color); border-radius:8px; padding:10px;" required>
                    <button type="submit" style="background:var(--text-color); color:var(--bg-color); border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Entrar</button>
                </form>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModalOverlay">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title">Configurações</span>
                    <button class="close-modal-btn" onclick="document.getElementById('settingsModalOverlay').classList.remove('active')">✕</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Tema da Interface</span>
                    <div style="display:flex; background:var(--card-bg); border:1px solid var(--border-color); border-radius:20px; padding:3px; gap:2px;">
                        <button id="themeDarkBtn" style="padding:6px 12px; border-radius:16px; border:none; background:transparent; color:var(--muted-color); cursor:pointer;">Escuro</button>
                        <button id="themeLightBtn" style="padding:6px 12px; border-radius:16px; border:none; background:transparent; color:var(--muted-color); cursor:pointer;">Claro</button>
                    </div>
                </div>
                <div style="font-size:0.8rem; color:var(--muted-color); border-top:1px solid var(--border-color); padding-top:10px;">Chronical I.A • Universal v7.0 Multimodal & Voice</div>
            </div>
        </div>

        <!-- Header -->
        <header>
            <button class="menu-toggle-btn" id="menuToggleBtn" title="Abrir Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="app-title" style="display: flex; align-items: center; gap: 12px;">
                Chronical I.A
                <button class="clear-current-chat-btn" id="clearCurrentChatBtn" title="Limpar conversa atual">Limpar chat</button>
            </div>
            <div class="header-auth-area" id="headerAuthArea"></div>
        </header>

        <!-- Chat Main -->
        <main class="chat-main" id="chatMain">
            <div class="welcome-container" id="welcomeContainer">
                <h1 class="welcome-title" id="welcomeTitle">Como posso ajudar você hoje?</h1>
            </div>
        </main>

        <!-- Input Section com Menu Popover de Anexos e Microfone -->
        <div class="input-section">
            <!-- Menu Popover do botão + -->
            <div class="attachment-menu" id="attachmentMenu">
                <button class="attachment-option" id="uploadImageOption">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    Carregar Imagem
                </button>
            </div>
            <!-- Input file invisível -->
            <input type="file" id="fileInput" accept="image/*" style="display: none;">

            <div class="input-box-wrapper">
                <!-- Pré-visualização da Imagem Anexada -->
                <div class="image-preview-container" id="imagePreviewContainer">
                    <img id="previewThumb" class="preview-thumb" src="">
                    <span class="preview-info" id="previewName">imagem.png</span>
                    <button class="remove-preview-btn" id="removePreviewBtn" title="Remover imagem">✕</button>
                </div>

                <div class="input-box">
                    <button class="attach-btn" id="attachMenuBtn" title="Adicionar anexo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                    <!-- Botão de Microfone (Reconhecimento de Voz) -->
                    <button class="mic-btn" id="micBtn" title="Falar por voz">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <button class="send-submit" id="sendBtn" title="Enviar">
                        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tema e UI básica
        const htmlElement = document.documentElement;
        const themeDarkBtn = document.getElementById('themeDarkBtn');
        const themeLightBtn = document.getElementById('themeLightBtn');

        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('chronical_theme', theme);
            if (theme === 'light') { themeLightBtn.style.background = 'var(--text-color)'; themeLightBtn.style.color = 'var(--bg-color)'; themeDarkBtn.style.background = 'transparent'; themeDarkBtn.style.color = 'var(--muted-color)'; }
            else { themeDarkBtn.style.background = 'var(--text-color)'; themeDarkBtn.style.color = 'var(--bg-color)'; themeLightBtn.style.background = 'transparent'; themeLightBtn.style.color = 'var(--muted-color)'; }
        }
        setTheme(localStorage.getItem('chronical_theme') || 'dark');
        themeDarkBtn.onclick = () => setTheme('dark');
        themeLightBtn.onclick = () => setTheme('light');

        // Firebase Auth
        const firebaseConfig = {
            apiKey: "AIzaSyBWXGHYL7ncUvFCp0g14sNQc-QTG756L2Q",
            authDomain: "chronical--ia.firebaseapp.com",
            projectId: "chronical--ia",
            storageBucket: "chronical--ia.firebasestorage.app",
            messagingSenderId: "441734519766",
            appId: "1:441734519766:web:83080edb3b69fc618a2277"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const headerAuthArea = document.getElementById('headerAuthArea');
        const sidebarUserCardContainer = document.getElementById('sidebarUserCardContainer');
        const welcomeTitle = document.getElementById('welcomeTitle');

        auth.onAuthStateChanged(user => {
            if (user) {
                const name = user.displayName || 'Utilizador';
                const initial = name.charAt(0).toUpperCase();
                welcomeTitle.textContent = `Como posso ajudar você, ${name.split(' ')[0]}?`;
                headerAuthArea.innerHTML = `
                    <div class="user-profile-wrapper">
                        <button class="user-avatar-btn" id="userAvatarBtn">${initial}</button>
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <div class="dropdown-user-info"><span class="dropdown-name">${name}</span><span class="dropdown-email">${user.email}</span></div>
                            <button class="dropdown-logout-btn" onclick="auth.signOut()">Terminar Sessão</button>
                        </div>
                    </div>
                `;
                document.getElementById('userAvatarBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('userDropdownMenu').classList.toggle('active'); };
                sidebarUserCardContainer.innerHTML = `<div class="sidebar-user-card"><div class="sidebar-user-avatar">${initial}</div><div class="sidebar-user-info"><span class="sidebar-user-name">${name}</span><span class="sidebar-user-email">${user.email}</span></div></div>`;
            } else {
                headerAuthArea.innerHTML = `<button class="header-login-text-btn" onclick="document.getElementById('authModalOverlay').classList.add('active')">Entrar</button>`;
                sidebarUserCardContainer.innerHTML = `<button class="sidebar-action-btn" onclick="document.getElementById('authModalOverlay').classList.add('active')">Entrar na Conta</button>`;
            }
        });

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .then(() => document.getElementById('authModalOverlay').classList.remove('active'))
                .catch(() => alert("Erro ao fazer login. Verifique os dados."));
        };

        // Gestão de Anexos (+) Menu Popover
        const attachMenuBtn = document.getElementById('attachMenuBtn');
        const attachmentMenu = document.getElementById('attachmentMenu');
        const uploadImageOption = document.getElementById('uploadImageOption');
        const fileInput = document.getElementById('fileInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const previewThumb = document.getElementById('previewThumb');
        const previewName = document.getElementById('previewName');
        const removePreviewBtn = document.getElementById('removePreviewBtn');

        let attachedImage = null;

        attachMenuBtn.onclick = (e) => { e.stopPropagation(); attachmentMenu.classList.toggle('active'); };
        window.onclick = () => attachmentMenu.classList.remove('active');

        uploadImageOption.onclick = () => { fileInput.click(); attachmentMenu.classList.remove('active'); };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
                const base64String = uploadEvent.target.result.split(',')[1];
                attachedImage = { mime_type: file.type, data: base64String };
                previewThumb.src = uploadEvent.target.result;
                previewName.textContent = file.name;
                imagePreviewContainer.classList.add('active');
            };
            reader.readAsDataURL(file);
        };

        removePreviewBtn.onclick = () => {
            attachedImage = null;
            imagePreviewContainer.classList.remove('active');
            fileInput.value = '';
        };

        // Mecanismo de Áudio (Speech-to-Text / Microfone)
        const micBtn = document.getElementById('micBtn');
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-PT';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                userInput.placeholder = "A ouvir a sua voz...";
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;
                userInput.style.height = 'auto';
                userInput.style.height = (userInput.scrollHeight) + 'px';
            };

            recognition.onerror = () => {
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            micBtn.style.display = 'none'; // Esconde se o browser não suportar
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
            userInput.placeholder = "Mensagem para a Chronical I.A...";
        }

        micBtn.onclick = () => {
            if (!recognition) {
                alert("O seu navegador não suporta reconhecimento de voz.");
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        };

        // Chat & Histórico State
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const searchBox = document.getElementById('searchBox');
        const storageCounter = document.getElementById('storageCounter');
        const clearCurrentChatBtn = document.getElementById('clearCurrentChatBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');

        let chats = JSON.parse(localStorage.getItem('chronical_chats')) || [];
        let currentChatId = localStorage.getItem('chronical_active_id') || null;

        document.getElementById('openSettingsBtn').onclick = () => document.getElementById('settingsModalOverlay').classList.add('active');
        document.getElementById('menuToggleBtn').onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); searchBox.value = ''; renderHistory(); };
        document.getElementById('closeSidebarBtn').onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };

        // Atalhos globais
        window.onkeydown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault(); sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); searchBox.focus();
            }
            if (e.key === 'Escape') {
                sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active');
                document.getElementById('settingsModalOverlay').classList.remove('active');
                document.getElementById('authModalOverlay').classList.remove('active');
                attachmentMenu.classList.remove('active');
            }
        };

        function renderHistory(filter = '') {
            historyList.innerHTML = '';
            const filtered = chats.filter(c => c.title.toLowerCase().includes(filter.toLowerCase()));
            storageCounter.textContent = `${chats.length} ${chats.length === 1 ? 'conversa guardada' : 'conversas guardadas'}`;
            if (filtered.length === 0) { historyList.innerHTML = '<div class="history-empty-state">Nenhuma conversa encontrada.</div>'; return; }
            filtered.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<span>💬</span><span class="history-text">${chat.title}</span>`;
                item.onclick = () => loadChat(chat.id);
                historyList.appendChild(item);
            });
        }

        newChatBtn.onclick = () => {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('chronical_active_id', currentChatId);
            resetToWelcome();
            sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active');
        };

        function resetToWelcome() {
            chatMain.innerHTML = `<div class="welcome-container" id="welcomeContainer"><h1 class="welcome-title">${welcomeTitle.textContent}</h1></div>`;
            clearCurrentChatBtn.style.display = 'none';
        }

        clearCurrentChatBtn.onclick = () => {
            chats = chats.filter(c => c.id !== currentChatId);
            localStorage.setItem('chronical_chats', JSON.stringify(chats));
            resetToWelcome(); renderHistory();
        };

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = chat.id;
            localStorage.setItem('chronical_active_id', currentChatId);
            chatMain.innerHTML = '';
            clearCurrentChatBtn.style.display = 'flex';
            chat.messages.forEach(m => appendMessageUI(m.sender, m.text, m.image));
            sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active');
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        clearHistoryBtn.onclick = () => {
            if (confirm("Tens a certeza que queres limpar todo o histórico?")) {
                chats = []; localStorage.removeItem('chronical_chats'); newChatBtn.click();
            }
        };

        exportChatBtn.onclick = () => {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.messages.length === 0) { alert("Nenhuma conversa ativa para exportar."); return; }
            let content = `# Chronical I.A - ${chat.title}\n\n`;
            chat.messages.forEach(m => {
                content += `**${m.sender === 'user' ? 'Utilizador' : 'Chronical I.A'}**: ${m.text}\n\n`;
            });
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
            a.click();
        };

        searchBox.oninput = (e) => renderHistory(e.target.value);

        function appendMessageUI(sender, text, imageUrl = null) {
            const welcome = document.getElementById('welcomeContainer');
            if (welcome) welcome.remove();
            clearCurrentChatBtn.style.display = 'flex';

            const div = document.createElement('div');
            div.className = `message ${sender}`;

            let htmlContent = '';
            if (imageUrl) {
                htmlContent += `<img class="msg-image" src="${imageUrl}">`;
            }

            if (sender === 'ai') {
                htmlContent += marked.parse(text);
                div.innerHTML = htmlContent;
                div.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };

                const speechBtn = document.createElement('button');
                speechBtn.className = 'msg-btn';
                speechBtn.innerHTML = `🔊 Ouvir`;
                speechBtn.onclick = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'pt-PT';
                        window.speechSynthesis.speak(utterance);
                    }
                };

                actions.appendChild(copyBtn);
                actions.appendChild(speechBtn);
                div.appendChild(actions);
            } else {
                htmlContent += text.replace(/\n/g, '<br>');
                div.innerHTML = htmlContent;
            }

            chatMain.appendChild(div);
            chatMain.scrollTop = chatMain.scrollHeight;
            return div;
        }

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            const currentImg = attachedImage;

            if (!text && !currentImg) return;

            let imgDataUrl = currentImg ? `data:${currentImg.mime_type};base64,${currentImg.data}` : null;
            appendMessageUI('user', text || "[Imagem enviada]", imgDataUrl);

            userInput.value = '';
            userInput.style.height = 'auto';
            attachedImage = null;
            imagePreviewContainer.classList.remove('active');
            fileInput.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            chatMain.appendChild(aiDiv);
            chatMain.scrollTop = chatMain.scrollHeight;

            let chat = chats.find(c => c.id === currentChatId);
            let historySnapshot = chat ? [...chat.messages] : [];
            historySnapshot.push({ sender: 'user', text: text || "[Imagem]", image: imgDataUrl });

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: historySnapshot, image: currentImg })
                });

                const data = await response.json();
                const aiReply = data.reply || "Sem resposta.";

                aiDiv.innerHTML = marked.parse(aiReply);
                aiDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

                const actions = document.createElement('div');
                actions.className = 'msg-footer-actions';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.innerHTML = `📋 Copiar`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(aiReply);
                    copyBtn.textContent = '✓ Copiado';
                    setTimeout(() => copyBtn.textContent = '📋 Copiar', 2000);
                };

                const speechBtn = document.createElement('button');
                speechBtn.className = 'msg-btn';
                speechBtn.innerHTML = `🔊 Ouvir`;
                speechBtn.onclick = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(aiReply);
                        utterance.lang = 'pt-PT';
                        window.speechSynthesis.speak(utterance);
                    }
                };

                actions.appendChild(copyBtn);
                actions.appendChild(speechBtn);
                aiDiv.appendChild(actions);

                if (!currentChatId) currentChatId = 'chat_' + Date.now();
                let activeChat = chats.find(c => c.id === currentChatId);
                if (!activeChat) {
                    activeChat = { id: currentChatId, title: (text || "Imagem").substring(0, 28) + '...', messages: [] };
                    chats.unshift(activeChat);
                }
                activeChat.messages.push({ sender: 'user', text: text || "[Imagem]", image: imgDataUrl });
                activeChat.messages.push({ sender: 'ai', text: aiReply });
                localStorage.setItem('chronical_chats', JSON.stringify(chats));
                renderHistory();

                chatMain.scrollTop = chatMain.scrollHeight;
            } catch (error) {
                aiDiv.innerHTML = "Erro ao comunicar com o servidor da Chronical I.A.";
            }
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
        };

        if (currentChatId) loadChat(currentChatId);
    </script>
</body>
</html>
