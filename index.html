<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A.</title>
    <style>
        :root {
            /* Tamanhos responsivos (do smartwatch à TV) */
            --font-size: clamp(14px, 2vw, 22px);
            --spacing: clamp(10px, 2vw, 30px);
            
            /* Paleta Minimalista */
            --bg-color: #050505; /* Fundo preto profundo */
            --text-user: #ffffff; /* Branco puro para as suas mensagens */
            --text-ai: #a1a1aa; /* Cinza suave para a I.A. */
            --accent: #3b82f6; /* Azul apenas para detalhes (botão/foco) */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Mantém a tela fixa */
        }

        /* Estrutura invisível para centralizar no PC e preencher no Smartwatch */
        .screen-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 900px; /* Limita a largura em ecrãs gigantes para leitura confortável */
            background: transparent; /* Sem fundo */
            border: none; /* Sem bordas */
        }

        /* Título limpo no topo */
        .chat-header {
            padding: var(--spacing);
            font-size: clamp(16px, 3vw, 28px);
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            color: var(--text-user);
        }

        /* Área onde o texto corre */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            gap: calc(var(--spacing) * 1.5); /* Espaço entre mensagens */
        }

        /* As palavras diretamente no fundo, sem caixas */
        .message {
            background: transparent;
            border: none;
            padding: 0;
            font-size: var(--font-size);
            max-width: 90%;
            word-break: break-word;
            line-height: 1.6;
        }

        .user-message {
            color: var(--text-user);
            align-self: flex-end;
            text-align: right;
            font-weight: 400;
        }

        .ai-message {
            color: var(--text-ai);
            align-self: flex-start;
            text-align: left;
            font-weight: 300;
        }

        /* Campo de texto minimalista */
        .chat-input-area {
            display: flex;
            gap: var(--spacing);
            padding: var(--spacing);
            margin-bottom: var(--spacing);
            background: transparent;
        }

        .chat-input-area input {
            flex: 1;
            padding: calc(var(--spacing) * 0.5) 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333; /* Apenas uma linha em baixo */
            color: var(--text-user);
            font-size: var(--font-size);
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-bottom-color: var(--accent); /* A linha brilha a azul quando escreve */
        }

        .chat-input-area button {
            padding: 0 var(--spacing);
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: calc(var(--font-size) * 0.9);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-input-area button:hover {
            color: #60a5fa;
        }
        
        /* Oculta a barra de rolagem para ficar mais limpo */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="screen-wrapper">
        <div class="chat-container">
            <div class="chat-header">Chronical I.A.</div>
            <div id="chatMessages" class="chat-messages">
                <div class="message ai-message">Olá! Como posso ajudar você hoje?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escreva a sua mensagem..." autocomplete="off">
                <button id="sendButton">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mensagem do Utilizador
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Pedido ao Backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                // Mensagem da IA
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = data.response || data.reply || "Resposta recebida.";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = "Erro ao comunicar com o servidor.";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
