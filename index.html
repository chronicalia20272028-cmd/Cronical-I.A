<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <!-- Biblioteca para renderizar Markdown nas mensagens -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Toast de Notificações */
        .toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: #1e293b; color: #ffffff; border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 18px; border-radius: 20px; font-size: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; visibility: hidden;
            transition: all 0.3s ease; z-index: 10000;
        }
        .toast-container.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        /* Drag & Drop Overlay */
        .drag-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(37, 99, 235, 0.85); backdrop-filter: blur(4px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 20px;
            opacity: 0; visibility: hidden; transition: all 0.2s ease; pointer-events: none;
        }
        .drag-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

        /* Layout Principal em Flexbox vertical */
        .app-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            position: relative;
        }

        /* Menu Lateral */
        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100%;
            background: #0b0e14; border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; z-index: 1000;
            transform: translateX(-100%); transition: transform 0.3s ease;
            padding: 20px; gap: 16px;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
            z-index: 999; opacity: 0; visibility: hidden; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px;
        }
        .close-sidebar-btn { background: transparent; border: none; color: #e2e8f0; font-size: 18px; cursor: pointer; }
        .new-chat-btn {
            background: #2563eb; color: #ffffff; border: none;
            padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;
        }

        /* Cabeçalho */
        .header {
            height: 56px; min-height: 56px; width: 100%; display: flex; align-items: center; justify-content: center;
            padding: 0 16px; background: #000000; border-bottom: 1px solid rgba(255,255,255,0.08);
            position: relative; z-index: 10; flex-shrink: 0;
        }
        .menu-toggle-btn {
            position: absolute; left: 16px; background: transparent; border: none; color: #e2e8f0;
            cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px;
        }
        .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }

        /* Área de Mensagens */
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%; padding: 12px 16px; font-size: 14px; line-height: 1.5;
            word-wrap: break-word; border-radius: 14px; flex-shrink: 0;
        }
        .ai-message {
            background-color: #121620; border: 1px solid rgba(255,255,255,0.08);
            color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .user-message {
            background-color: #2563eb; color: white; align-self: flex-end;
            border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        /* Zona de Input Inferior */
        .input-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000000;
            flex-shrink: 0;
            position: relative;
        }

        /* Container de Pré-visualização de Ficheiros */
        .preview-container {
            width: 100%; margin-bottom: 8px; display: none; gap: 8px; overflow-x: auto; padding-bottom: 4px;
        }
        .preview-container.active { display: flex; }
        .preview-card {
            background: #121620; border: 1px solid rgba(255,255,255,0.08); padding: 6px 10px; border-radius: 12px;
            display: flex; align-items: center; gap: 10px; flex-shrink: 0; max-width: 220px;
        }
        .preview-thumb {
            width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #1f2937;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #93c5fd; font-weight: 700; flex-shrink: 0;
        }
        .preview-meta { display: flex; flex-direction: column; overflow: hidden; }
        .preview-info { font-size: 11px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
        .remove-preview { background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 4px; margin-left: auto; }
        .remove-preview:hover { color: #ef4444; }

        /* Menu Flutuante de Anexos */
        .attachment-menu {
            position: absolute; bottom: calc(100% + 8px); left: 16px;
            background: #141824; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; width: 220px;
            padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 16px 40px rgba(0,0,0,0.8);
            opacity: 0; visibility: hidden; transform: translateY(10px) scale(0.95); transition: all 0.2s ease; z-index: 101;
        }
        .attachment-menu.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        .menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px; color: #e2e8f0;
            background: transparent; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; text-align: left; width: 100%;
        }
        .menu-item:hover { background: rgba(37, 99, 235, 0.15); color: #93c5fd; }
        .menu-item svg { width: 16px; height: 16px; stroke: #94a3b8; }

        /* Barra de Entrada */
        .input-area {
            display: flex; width: 100%; gap: 8px; background: #121620;
            padding: 8px 12px; border-radius: 32px; border: 1px solid rgba(255,255,255,0.08); align-items: flex-end;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .plus-btn, .mic-btn {
            background: transparent; color: #94a3b8; border: none; width: 36px; height: 36px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0;
        }
        .plus-btn:hover, .mic-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .mic-btn.recording { color: #ef4444; background: rgba(239, 68, 68, 0.15); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .input-area textarea {
            flex: 1; background: transparent; border: none; color: #e2e8f0;
            font-size: 14px; outline: none; padding: 8px 4px; resize: none; max-height: 100px; min-height: 20px; line-height: 1.4;
        }
        .input-area button.send-btn {
            background: #ffffff; color: #000000; border: none; width: 36px; height: 36px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0;
        }
        .input-area button.send-btn:hover { background: #e2e8f0; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer">Notificação</div>
    <div class="drag-overlay" id="dragOverlay">Solte os ficheiros aqui para anexar</div>

    <div class="app-layout">
        <!-- Menu Lateral -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Menu</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
            </div>
            <button class="new-chat-btn" id="newChatBtn">Nova Conversa</button>
        </aside>

        <!-- Cabeçalho -->
        <header class="header">
            <button class="menu-toggle-btn" id="menuToggleBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="header-title">Chronical I.A</div>
        </header>

        <!-- Contentor de Mensagens -->
        <main class="chat-container" id="chatMessages">
            <div class="message ai-message">Olá! Como posso ajudar você hoje?</div>
        </main>

        <!-- Zona de Input -->
        <div class="input-wrapper">
            <div class="preview-container" id="previewContainer"></div>

            <!-- Menu Flutuante de Anexos -->
            <div class="attachment-menu" id="attachmentMenu">
                <button class="menu-item" id="btnPhoto"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Imagem / Foto</button>
                <button class="menu-item" id="btnDoc"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Documento</button>
                <button class="menu-item" id="btnCode"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Código</button>
            </div>

            <input type="file" id="fileInput" multiple style="display: none;">

            <div class="input-area">
                <button class="plus-btn" id="plusButton" title="Adicionar anexo">
                    <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="mic-btn" id="micButton" title="Gravar áudio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/></svg>
                </button>
                <button class="send-btn" id="sendButton" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const plusButton = document.getElementById('plusButton');
        const micButton = document.getElementById('micButton');
        const attachmentMenu = document.getElementById('attachmentMenu');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const dragOverlay = document.getElementById('dragOverlay');
        const toastContainer = document.getElementById('toastContainer');
        
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');

        let attachedFiles = [];
        let isRecording = false;

        function showToast(message) {
            toastContainer.textContent = message;
            toastContainer.classList.add('show');
            setTimeout(() => toastContainer.classList.remove('show'), 3000);
        }

        // Menu Lateral
        menuToggleBtn.onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); };
        closeSidebarBtn.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        newChatBtn.onclick = () => {
            chatMessages.innerHTML = '<div class="message ai-message">Nova conversa iniciada! Como posso ajudar?</div>';
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        };

        // Menu de Anexos
        plusButton.onclick = (e) => { e.stopPropagation(); attachmentMenu.classList.toggle('active'); };
        document.onclick = () => attachmentMenu.classList.remove('active');
        attachmentMenu.onclick = (e) => e.stopPropagation();

        // Acionar seleção de ficheiros pelos botões do menu
        document.getElementById('btnPhoto').onclick = () => { fileInput.accept = "image/*"; fileInput.click(); attachmentMenu.classList.remove('active'); };
        document.getElementById('btnDoc').onclick = () => { fileInput.accept = ".pdf,.txt,.doc,.docx"; fileInput.click(); attachmentMenu.classList.remove('active'); };
        document.getElementById('btnCode').onclick = () => { fileInput.accept = ".py,.js,.html,.css,.json,.cpp,.java"; fileInput.click(); attachmentMenu.classList.remove('active'); };

        fileInput.onchange = (e) => { handleFiles(e.target.files); };

        function handleFiles(files) {
            for (let file of files) {
                attachedFiles.push(file);
            }
            renderPreviews();
        }

        function renderPreviews() {
            previewContainer.innerHTML = '';
            if (attachedFiles.length === 0) {
                previewContainer.classList.remove('active');
                return;
            }
            previewContainer.classList.add('active');
            attachedFiles.forEach((file, index) => {
                const card = document.createElement('div');
                card.className = 'preview-card';
                
                let thumbText = file.name.split('.').pop().toUpperCase();
                card.innerHTML = `
                    <div class="preview-thumb">${thumbText}</div>
                    <div class="preview-meta">
                        <span class="preview-info">${file.name}</span>
                    </div>
                    <button class="remove-preview" onclick="removeFile(${index})">✕</button>
                `;
                previewContainer.appendChild(card);
            });
        }

        window.removeFile = function(index) {
            attachedFiles.splice(index, 1);
            renderPreviews();
        };

        // Drag and Drop
        window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
        window.addEventListener('dragleave', (e) => { if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active'); });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.classList.remove('active');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
                showToast("Ficheiro(s) anexado(s) com sucesso!");
            }
        });

        // Botão de Áudio / Microfone
        micButton.onclick = () => {
            isRecording = !isRecording;
            if (isRecording) {
                micButton.classList.add('recording');
                showToast("A gravar áudio... Clica novamente para enviar.");
            } else {
                micButton.classList.remove('recording');
                showToast("Áudio simulado e processado com sucesso!");
                const userMsg = document.createElement('div');
                userMsg.className = 'message user-message';
                userMsg.textContent = "🎤 [Mensagem de Áudio]";
                chatMessages.appendChild(userMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai-message';
                    aiMsg.innerHTML = marked.parse("Ouvi o teu áudio! Como posso ajudar com base nele?");
                    chatMessages.appendChild(aiMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 600);
            }
        };

        // Textarea Auto-expand
        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        // Enviar Mensagem
        sendButton.onclick = () => {
            const text = userInput.value.trim();
            if (!text && attachedFiles.length === 0) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            let displayText = text;
            if (attachedFiles.length > 0) {
                displayText += ` [📎 ${attachedFiles.length} anexo(s)]`;
            }
            userMsg.textContent = displayText;
            chatMessages.appendChild(userMsg);

            userInput.value = '';
            userInput.style.height = 'auto';
            attachedFiles = [];
            renderPreviews();
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.innerHTML = marked.parse("Recebido! Estou a analisar a tua mensagem e os anexos.");
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 600);
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendButton.click();
            }
        };
    </script>
</body>
</html>
