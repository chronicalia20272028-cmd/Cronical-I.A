<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A.</title>
    <style>
        * {
            box-sizing: border-box; /* Isto resolve o problema do botão cortado */
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            /* Mantém o teu fundo original por trás, mas garante que a estrutura não quebra */
            background-color: transparent; 
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Título perfeitamente centrado e com efeito de vidro */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 15px 20px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px); /* Desfoca o que está por trás */
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* Área de mensagens bem alinhada */
        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Balões com efeito Glassmorphism (Vidro Translúcido) */
        .message {
            max-width: 85%;
            padding: 14px 20px;
            font-size: clamp(14px, 2vw, 16px);
            line-height: 1.5;
            word-wrap: break-word;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .ai-message {
            /* Fundo semitransparente escuro para destacar no teu fundo azul */
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .user-message {
            /* Fundo azul vibrante semitransparente */
            background-color: rgba(37, 99, 235, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        /* Área de escrita flutuante fixa */
        .input-wrapper {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: center;
            background: linear-gradient(transparent, rgba(0,0,0,0.5) 50%);
        }

        .input-area {
            display: flex;
            width: 100%;
            max-width: 800px;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            outline: none;
            width: 100%; /* Garante que não empurra o botão para fora */
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap; /* Impede que o texto "Enviar" quebre para duas linhas */
        }

        .input-area button:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        /* Scrollbar mais bonita */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">Chronical I.A.</div>
    <div class="chat-container" id="chatMessages">
        <div class="message ai-message">Olá! Como posso ajudar você hoje?</div>
    </div>
    <div class="input-wrapper">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escreva a sua mensagem..." autocomplete="off">
            <button id="sendButton">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = data.response || data.reply || "Resposta recebida.";
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai-message';
                errorMsg.textContent = "Erro ao comunicar com o servidor.";
                chatMessages.appendChild(errorMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
