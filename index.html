<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <style>
        /* --- VARIÁVEIS GLOBAIS DE ESCALA (Responsivo Universal) --- */
        :root {
            --font-size: 14px;
            --header-height: 56px;
            --chat-max-width: 800px;
            --padding-base: 16px;
            --border-radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            font-size: var(--font-size);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Cabeçalho */
        header {
            height: var(--header-height);
            min-height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 var(--padding-base);
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            flex-shrink: 0;
            z-index: 10;
        }

        .menu-toggle-btn {
            position: absolute;
            left: var(--padding-base);
            background: transparent;
            border: none;
            color: #f1f5f9;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
            z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: 0; 
            width: clamp(240px, 75vw, 320px); 
            height: 100%;
            background: #0a0d14; border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 999; display: flex; flex-direction: column; padding: var(--padding-base); gap: 16px;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.05rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px;
        }
        .close-sidebar-btn { background: transparent; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer; }

        .new-chat-btn {
            background: #2563eb; color: #ffffff; border: none; padding: 10px 14px;
            border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background: #1d4ed8; }

        /* Área de Chat */
        .chat-main {
            flex: 1;
            width: 100%;
            max-width: var(--chat-max-width);
            margin: 0 auto;
            padding: var(--padding-base);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: var(--border-radius);
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .message.ai {
            background-color: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        /* Zona de Input */
        .input-section {
            width: 100%;
            max-width: var(--chat-max-width);
            margin: 0 auto;
            padding: var(--padding-base);
            background: #000000;
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            padding: 6px 4px;
            resize: none;
            max-height: 120px;
            min-height: 22px;
            line-height: 1.4;
        }

        textarea::placeholder { color: #64748b; }

        .send-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .send-submit:hover { background: #cbd5e1; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }


        /* ==========================================================
           ADAPTAÇÕES POR DISPOSITIVO (MEDIA QUERIES)
           ========================================================== */

        /* 1. Smartwatches (Abaixo de 320px) */
        @media (max-width: 320px) {
            :root {
                --font-size: 11px;
                --header-height: 40px;
                --padding-base: 6px;
                --border-radius: 10px;
            }
            .message { max-width: 95%; padding: 6px 10px; }
            .send-submit { width: 28px; height: 28px; min-width: 28px; }
            .send-submit svg { width: 12px; height: 12px; }
        }

        /* 2. Tablets (A partir de 768px) */
        @media (min-width: 768px) {
            :root {
                --font-size: 15px;
                --header-height: 64px;
                --chat-max-width: 850px;
                --padding-base: 24px;
                --border-radius: 16px;
            }
            .send-submit { width: 42px; height: 42px; min-width: 42px; }
            .send-submit svg { width: 18px; height: 18px; }
        }

        /* 3. Desktops e Smart TVs (A partir de 1400px) */
        @media (min-width: 1400px) {
            :root {
                --font-size: 18px;
                --header-height: 76px;
                --chat-max-width: 1100px;
                --padding-base: 32px;
                --border-radius: 20px;
            }
            .send-submit { width: 50px; height: 50px; min-width: 50px; }
            .send-submit svg { width: 22px; height: 22px; }
            .input-box { border-radius: 32px; padding: 12px 18px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Menu Lateral & Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Menu</span>
                <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
            </div>
            <button class="new-chat-btn" id="newChatBtn">
                <span>+</span> Nova Conversa
            </button>
        </aside>

        <!-- Cabeçalho -->
        <header>
            <button class="menu-toggle-btn" id="menuToggleBtn" title="Abrir Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="app-title">Chronical I.A</div>
        </header>

        <!-- Mensagens do Chat -->
        <main class="chat-main" id="chatMain">
            <div class="message ai">Olá! Como posso ajudar você hoje?</div>
        </main>

        <!-- Barra de Input -->
        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const newChatBtn = document.getElementById('newChatBtn');

        // Controlo do Menu Lateral
        menuToggleBtn.onclick = () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); };
        closeSidebarBtn.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); };

        // Botão de Nova Conversa
        newChatBtn.onclick = () => {
            chatMain.innerHTML = '<div class="message ai">Nova conversa iniciada! Como posso ajudar?</div>';
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        };

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = () => {
            const text = userInput.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            chatMain.appendChild(userDiv);

            userInput.value = '';
            userInput.style.height = 'auto';
            chatMain.scrollTop = chatMain.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.textContent = "Mensagem recebida: " + text;
                chatMain.appendChild(aiDiv);
                chatMain.scrollTop = chatMain.scrollHeight;
            }, 500);
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
