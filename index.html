<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        header {
            height: 56px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .chat-main {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            border-radius: 14px;
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .message.ai {
            background-color: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .input-section {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 16px 16px 16px;
            background: #000000;
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            padding: 8px 4px;
            resize: none;
            max-height: 120px;
            min-height: 22px;
            line-height: 1.4;
        }

        .send-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .send-submit:hover { background: #cbd5e1; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="app-title">Chronical I.A</div>
        </header>

        <main class="chat-main" id="chatMain">
            <div class="message ai">Olá! Como posso ajudar você hoje?</div>
        </main>

        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem para a Chronical I.A..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = () => {
            const text = userInput.value.trim();
            if (!text) return;

            // Mensagem do utilizador
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            chatMain.appendChild(userDiv);

            userInput.value = '';
            userInput.style.height = 'auto';
            chatMain.scrollTop = chatMain.scrollHeight;

            // Resposta simples da IA após meio segundo
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.textContent = "Mensagem recebida: " + text;
                chatMain.appendChild(aiDiv);
                chatMain.scrollTop = chatMain.scrollHeight;
            }, 500);
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
