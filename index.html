<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronical I.A</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        header {
            /* Cresce entre 40px (watch) e 80px (TV) */
            height: clamp(40px, 6vh, 80px);
            min-height: clamp(40px, 6vh, 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(8px, 2vw, 24px);
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-title {
            /* Fonte fluida: 14px no mínimo, 32px na TV */
            font-size: clamp(14px, 1.5vw + 10px, 32px);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .chat-main {
            flex: 1;
            width: 100%;
            /* Limite central: adapta-se a telemóveis e monitores */
            max-width: clamp(100%, 80vw, 900px);
            margin: 0 auto;
            padding: clamp(8px, 2vw, 32px) clamp(12px, 3vw, 40px);
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2vw, 24px);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            /* O balão ocupa mais espaço no relógio (95%) e menos na TV (75%) */
            max-width: clamp(75%, 85%, 95%);
            padding: clamp(10px, 1.5vw, 24px) clamp(14px, 2vw, 32px);
            font-size: clamp(13px, 1.2vw + 9px, 26px);
            line-height: 1.5;
            border-radius: clamp(12px, 2vw, 20px);
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .message.ai {
            background-color: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .input-section {
            width: 100%;
            max-width: clamp(100%, 80vw, 900px);
            margin: 0 auto;
            padding: clamp(6px, 1.5vw, 24px) clamp(12px, 3vw, 40px) clamp(12px, 3vw, 40px) clamp(12px, 3vw, 40px);
            background: #000000;
            flex-shrink: 0;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: clamp(6px, 1vw, 16px);
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: clamp(6px, 1vw, 16px) clamp(10px, 1.5vw, 24px);
            border-radius: clamp(20px, 3vw, 40px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: clamp(13px, 1.2vw + 9px, 26px);
            outline: none;
            padding: clamp(4px, 0.5vw, 12px) 4px;
            resize: none;
            max-height: clamp(80px, 15vh, 250px);
            min-height: clamp(20px, 2vh, 32px);
            line-height: 1.4;
        }

        .send-submit {
            background: #ffffff;
            color: #000000;
            border: none;
            /* Botão de envio fluído */
            width: clamp(32px, 3vw + 16px, 56px);
            height: clamp(32px, 3vw + 16px, 56px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .send-submit svg {
            width: clamp(14px, 1.5vw + 8px, 24px);
            height: clamp(14px, 1.5vw + 8px, 24px);
        }
        
        .send-submit:hover { background: #cbd5e1; }

        ::-webkit-scrollbar { width: clamp(4px, 0.5vw, 8px); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* --- OTIMIZAÇÕES EXTREMAS --- */
        
        /* Smartwatches (Até 320px) */
        @media (max-width: 320px) {
            .chat-main { padding: 6px; }
            .message { max-width: 98%; padding: 8px 10px; font-size: 12px; }
            .input-section { padding: 6px; }
            .input-box { padding: 4px 6px; border-radius: 16px; }
            .send-submit { width: 28px; height: 28px; }
            textarea { font-size: 12px; }
        }

        /* Smart TVs e Ultra-Wides (A partir de 1920px) */
        @media (min-width: 1920px) {
            .chat-main, .input-section { max-width: 1400px; } /* Permite o chat esticar mais na TV */
            .message { max-width: 65%; } /* Evita que o texto fique de uma ponta à outra num ecrã gigante */
            .input-box { border-radius: 48px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="app-title">Chronical I.A</div>
        </header>

        <main class="chat-main" id="chatMain">
            <div class="message ai">Olá! Como posso ajudar você hoje?</div>
        </main>

        <div class="input-section">
            <div class="input-box">
                <textarea id="userInput" placeholder="Mensagem..." rows="1"></textarea>
                <button class="send-submit" id="sendBtn" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 20L12 4M12 4L6 10M12 4L18 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMain = document.getElementById('chatMain');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };

        sendBtn.onclick = () => {
            const text = userInput.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            chatMain.appendChild(userDiv);

            userInput.value = '';
            userInput.style.height = 'auto';
            chatMain.scrollTop = chatMain.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                aiDiv.textContent = "Mensagem recebida: " + text;
                chatMain.appendChild(aiDiv);
                chatMain.scrollTop = chatMain.scrollHeight;
            }, 500);
        };

        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
